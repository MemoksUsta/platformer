<script>
/* ===== KAYIT SLOTLARI (zorluk bazlı) — ana oyundan ÖNCE çalışır ===== */
(function(){
"use strict";
const NAMES = ["easy","normal","hard","impossible"], TR = ["Kolay","Normal","Zor","İmkansız"];
const KEYS = ["plat2_unlock","plat2_lb","plat_wallet","plat_shop","plat_skin","plat_best","plat_wb","plat_meta","plat_ext","plat_endless","plat_pet"];
const g = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const s = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const r = k => { try{ localStorage.removeItem(k); }catch(e){} };
const pj = t => { try{ const j = JSON.parse(t); return (j && typeof j === "object") ? j : null; }catch(e){ return null; } };
const DEFMETA = () => ({xp:0,lv:1,ach:{},done:{},tot:{kills:0,coins:0,boss:0,lvls:0,flaw:0},q:{d:"",w:"",dp:{},wp:{},dc:{},wc:{},hid:false},fps:false});
const slotKey = i => "save_"+NAMES[i];
function read(i){ const j = pj(g(slotKey(i))); return (j && j.d && typeof j.d === "object") ? j : null; }
function snapshot(){ const d = {}; KEYS.forEach(k => { const v = g(k); if (v !== null) d[k] = v; }); return d; }
let _lf = ""; function flush(i){ if (window.__sw) return; const d = JSON.stringify(snapshot()); if (_lf === i+d) return; _lf = i+d; s(slotKey(i), '{"v":1,"t":'+Date.now()+',"d":'+d+'}'); }
function writeLive(d){
  d = d || {};
  const cExt = pj(g("plat_ext")), cMeta = pj(g("plat_meta"));
  KEYS.forEach(k => { if (typeof d[k] === "string") s(k, d[k]); else r(k); });
  // grafik/tuş ayarları ve FPS göstergesi slotlar arasında ortak kalır
  if (cExt && (cExt.kb || cExt.gfx)){ const n = pj(d.plat_ext) || {}; n.kb = cExt.kb || {}; if (cExt.gfx) n.gfx = cExt.gfx; s("plat_ext", JSON.stringify(n)); }
  if (cMeta && cMeta.fps){ const m = pj(d.plat_meta) || DEFMETA(); m.fps = true; s("plat_meta", JSON.stringify(m)); }
  else { const m = pj(d.plat_meta); if (m && m.fps){ m.fps = false; s("plat_meta", JSON.stringify(m)); } }
}
const raw = g("plat_diff");
let cur = raw === null ? 1 : Math.min(3, Math.max(0, Math.round(+raw) || 0));
const any = [0,1,2,3].some(i => read(i));
if (!any){ if (g("plat_v") === "3") flush(cur); }   // eski tek kayıt -> mevcut zorluğun slotuna taşınır
else { const sl = read(cur); writeLive(sl ? sl.d : null); }

function info(i, full){
  const d = i === cur ? snapshot() : ((read(i) || {}).d || {});
  const un = Math.max(1, Math.min(144, Math.round(+d.plat2_unlock) || 1));
  const lbj = d.plat2_lb || "", wal = Math.round(+d.plat_wallet) || 0, rec = pj(d.plat_endless) || {};
  const o = { played: un > 1 || lbj.length > 2 || wal > 0 || !!rec.w, un, s:Math.floor((un-1)/12)+1, l:(un-1)%12+1, gold:wal, wave:rec.w || 0, stars:0 };
  if (full){ const m = pj(d.plat_meta); if (m && m.done) for (const k in m.done) o.stars += (+m.done[k]) || 0; }
  return o;
}
const ic = { t:0, v:[] };
window.slotInfo = i => {
  const t = Date.now();
  if (t - ic.t > 400){ ic.t = t; ic.v = [0,1,2,3].map(j => { const f = info(j); return f.played ? "S"+f.s+" • B"+f.l : "Yeni"; }); }
  return ic.v[i] || "";
};
function switchTo(i){
  flush(cur); window.__sw = true; s("plat_diff", String(i)); cur = i; ic.t = 0;
  try{ location.reload(); }catch(e){}
}
function exportAll(){
  flush(cur); const o = {v:1, t:Date.now(), game:"platform-macerasi", slots:{}};
  NAMES.forEach((n,i) => { const sl = read(i); if (sl) o.slots[n] = sl; });
  return btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function importAll(txt){
  let o; try{ o = JSON.parse(decodeURIComponent(escape(atob(String(txt).replace(/\s+/g,""))))); }catch(e){ return "Geçersiz yedek metni"; }
  if (!o || !o.slots || typeof o.slots !== "object") return "Geçersiz yedek metni";
  let n = 0;
  NAMES.forEach((nm,i) => { const sl = o.slots[nm]; if (sl && sl.d && typeof sl.d === "object"){ s(slotKey(i), JSON.stringify({v:1, t:Date.now(), d:sl.d})); n++; } });
  if (!n) return "Yedekte kayıt bulunamadı";
  window.__sw = true; ic.t = 0;
  try{ location.reload(); }catch(e){}
  return "OK";
}
window.SLOTS = { switchTo, exportAll, importAll, NAMES, TR, KEYS, read, flush, snapshot, writeLive, info, DEFMETA, cur:() => cur, setCur:i => { cur = i; ic.t = 0; } };
setInterval(() => flush(cur), 1500);
addEventListener("pagehide", () => flush(cur));
addEventListener("beforeunload", e => { if (window.__sw){ e.stopImmediatePropagation(); return; } flush(cur); }, true);
document.addEventListener("visibilitychange", () => { if (document.hidden) flush(cur); });
})();

</script>

// Karakterler: # zemin | P başlangıç | F çıkış | b s g altın | ^ diken | E yürüyen | J zıplayan | V yarasa
//              T top atan kule | U yay | H can | I yıldız (yenilmezlik) | K kontrol noktası | B boss | A balta | Y anahtar | M N mini boss
function mk(W, H = 14){
  const g = Array.from({length:H}, () => Array(W).fill("."));
  const a = {
    fill(c0,c1,r0,r1,ch="#"){ for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++) if (r>=0&&r<H&&c>=0&&c<W) g[r][c]=ch; return a; },
    ground(c0,c1,top=11){ return a.fill(c0,c1,top,H-1); },
    plat(c,r,len){ return a.fill(c,c+len-1,r,r); },
    block(c,r,w,h){ return a.fill(c,c+w-1,r,r+h-1); },
    put(c,r,ch){ if (r>=0&&r<H&&c>=0&&c<W) g[r][c]=ch; return a; },
    at(ch,cols,r=10){ cols.forEach(c => a.put(c,r,ch)); return a; },
    line(c,r,n,ch="b"){ for (let i=0;i<n;i++) a.put(c+i,r,ch); return a; },
    arc(c,r,n,ch="b",h=1.5){ for (let i=0;i<n;i++) a.put(c+i, Math.round(r-Math.sin(i/((n-1)||1)*Math.PI)*h), ch); return a; },
    get(c,r){ return (r>=0&&r<H&&c>=0&&c<W) ? g[r][c] : "#"; },
    rows(){ return g.map(r => r.join("")); }
  };
  return a;
}

// ---- boss arenaları (12. bölümler)
function arenaG(s){
  const v = s % 3, m = mk(44), pr = v === 1 ? 7 : 6;
  m.ground(0,43).plat(5,8,4).plat(35,8,4).plat(17,pr,10);
  if (v === 2) m.plat(11,7,3).plat(30,7,3);
  m.line(6,7,2,"s").line(36,7,2,"s").line(18,pr-1,8,"b").put(21,pr-1,"H");
  m.put(9,10,"A").put(37,10,"A");
  m.put(3,10,"P").put(41,10,"F").put(30,10,"B");
  return m.rows();
}
function arenaA(s){
  const v = s % 3, m = mk(48), pr = v === 1 ? 7 : 6;
  m.ground(0,47).plat(4,8,5).plat(39,8,5).plat(19,pr,10).plat(11,7,3).plat(34,7,3);
  m.line(5,7,3,"s").line(40,7,3,"s").put(41,7,"H").line(20,pr-1,8,"b").put(23,pr-1,"H").line(11,6,3).line(34,6,3);
  m.put(8,10,"A").put(40,10,"A");
  m.put(3,10,"P").put(44,10,"F").put(24,3,"B");
  return m.rows();
}

// ---- rastgele ama tohumlu bölüm üretici
function gen(o){
  let seed = o.seed; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647, ri = (a,b) => a+Math.floor(rnd()*(b-a+1));
  const n = o.n, lens = [14], gaps = [], miniAt = {}, flt = {};
  for (let i = 1; i <= n; i++) lens.push(ri(9,15));
  lens.push(14);
  (o.minis||[]).forEach(([f,k]) => { const i = Math.max(2, Math.min(n, Math.floor(f*(n+1)))); miniAt[i] = k; lens[i] = 17; });
  for (let i = 0; i < lens.length-1; i++) gaps.push(ri(2, o.gap));
  const W = lens.reduce((a,b) => a+b, 0) + gaps.reduce((a,b) => a+b, 0), m = mk(W), segs = []; let x = 0;
  lens.forEach((L,i) => { segs.push([x, x+L-1]); m.ground(x, x+L-1); x += L+(gaps[i]||0); });
  const row = k => (k === "V" || k === "W") ? ri(5,7) : 10, pick = () => o.pool[ri(0, o.pool.length-1)];
  segs.forEach(([a,b],i) => {
    if (i === 0) return;
    const L = b-a+1, last = i === segs.length-1, gap = gaps[i] || 0, mn = miniAt[i];
    if (i % 2 === 0 || mn) m.put(a+1, 10, "K");
    if (last) return;
    if (rnd() < 0.55) m.arc(a+3, 9, 6, rnd() < 0.3 ? "s" : "b", 2);
    if (gap >= 4){ m.plat(b+2, 9, 2); m.line(b+2, 8, 2, "s"); }
    if (rnd() < o.float){ const fc = a+(L>>1)-2; m.plat(fc, 8, 4); m.line(fc, 7, 4, "b"); flt[i] = fc; }
    if (i % 4 === 3) m.put(a+L-5, 8, "H");
    if (i % (o.sm || 5) === (o.sm || 5)-1 && !mn && flt[i] === undefined){ m.put(a+3, 10, "U"); m.put(a+3, 4, "g"); m.put(a+4, 4, "g"); }
    if (i === (n>>1)+1) m.put(a+2, 10, "I");
    if (i % 4 === 1 && !mn) m.put(a+ri(6, Math.max(6, L-6)), 10, "A");
    if (mn) m.put(a+ri(9,11), mn === "N" ? 4 : 10, mn);
    else {
      if (rnd() < o.enemy){ const k = pick(); m.put(a+ri(4,L-5), row(k), k); }
      if (rnd() < o.enemy*0.5){ const k = pick(); m.put(a+ri(4,L-5), row(k), k); }
      if (rnd() < o.spike){ const s0 = b-ri(3,5); m.at("^", rnd() < 0.5 ? [s0,s0+1] : [s0,s0+1,s0+2]); }

         hint:i === 0 ? 12 : (i < 4 ? 6 : 0), banner:3.5, bonusT:0, bonusH:0, bonusC:0, best:+ls("plat_best",0), lvl:i, shake:0, flash:0, cp:null,
         last:i === LEVELS.length-1, paused:false,

  if (o.cp){
    const cx = o.cp.x, cy = o.cp.y, bh = (q,mm) => LV.dir === "up" ? q.y > cy+mm : LV.dir === "down" ? q.y < cy-mm : q.x < cx-mm; player.x = cx; player.y = o.cp.y+0.06; player.safe = {x:player.x,y:player.y}; player.invul = 1.5;
    for (let k = coins.length-1; k >= 0; k--) if (bh(coins[k],0.5)){ st.coins++; st.score += coins[k].value; coins.splice(k,1); }
    const ne = enemies.length; enemies = enemies.filter(e => !bh(e,1.5)); st.kills += ne - enemies.length;

const EPS = 1e-4;
function rng(e){ return [Math.floor(e.x-e.hw+0.5+EPS), Math.floor(e.x+e.hw+0.5-EPS), Math.floor(e.y-e.hh+0.5+EPS), Math.floor(e.y+e.hh+0.5-EPS)]; }
function moveBox(e, dt){
  e.x += e.vx*dt;
  let [c0,c1,r0,r1] = rng(e);
  e.hitX = false;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(c,r)){
    if (e.vx > 0) e.x = c-0.5-e.hw; else if (e.vx < 0) e.x = c+0.5+e.hw; else continue;
    e.vx = 0; e.hitX = true;
    [c0,c1] = rng(e);
  }
  e.y += e.vy*dt;
  [c0,c1,r0,r1] = rng(e);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(c,r)){
    if (e.vy > 0) e.y = r-0.5-e.hh; else if (e.vy < 0) e.y = r+0.5+e.hh; else continue;
    e.vy = 0;
    [,, r0, r1] = rng(e);
  }
}
const groundedBox = e => solidPt(e.x-e.hw*0.9, e.y+e.hh+0.04) || solidPt(e.x+e.hw*0.9, e.y+e.hh+0.04);
const overlap = (a, bx, by, bhw, bhh) => Math.abs(a.x-bx) < a.hw+bhw && Math.abs(a.y-by) < a.hh+bhh;

function addPopup(text, x, y, big){ popups.push({text,x,y,t:0,big}); }
function burst(x,y,n,cols,sp=3,life=0.5,grav=12,size=2){
  if (parts.length > 450) return;
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.283, s = sp*(0.3+Math.random()*0.7);
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-sp*0.4, life:life*(0.6+Math.random()*0.6), max:life, col:cols[(Math.random()*cols.length)|0], g:grav, sz:size });
  }
}
function rayBlocked(x0,y0,x1,y1){
  const d = Math.hypot(x1-x0, y1-y0), n = Math.max(1, Math.ceil(d/0.2));
  for (let i = 1; i < n; i++){ const t = i/n; if (solidPt(x0+(x1-x0)*t, y0+(y1-y0)*t)) return true; }
  return false;
}

function damagePlayer(srcX){

  st.hp--; st.flash = 0.25; st.shake = Math.max(st.shake, 0.18); SFX.hit(); addPopup("-1 CAN", p.x, p.y-0.9, true);

}
function killPlayer(){

  st.state = "over"; st.endT = 0; SFX.lose();

function winGame(){
  if (st.state !== "play") return;
  st.state = "won"; st.endT = 0; player.control = false; player.vx = 0;
  st.bonusT = Math.max(0, Math.round(LV.par - st.time)) * 5; st.bonusH = st.hp * 50; st.bonusC = (st.total > 0 && st.coins >= st.total) ? 200 : 0;

  run.score = st.score; run.coins += st.coins; run.total += st.total; run.kills += st.kills; run.time += st.time;

function updatePlayer(dt){
  const p = player;
  if (p.dead){ p.vy += G*dt; p.y += p.vy*dt; return; }

  let move = 0;
  if (p.control && p.stun <= 0){ if (down("ArrowLeft","KeyA","TouchLeft")) move -= 1; if (down("ArrowRight","KeyD","TouchRight")) move += 1; }
  if (p.control){
    if (jumpPressed) p.buf = BUFFER;
    if (jumpReleased && p.vy < -0.1) p.cut = true;
  }
  if (move > 0) p.facing = 1; else if (move < 0) p.facing = -1;

  p.grounded = groundedBox(p);
  if (p.grounded) p.combo = 0;
  p.wall = (!p.grounded && p.hitX && move !== 0 && p.dash <= 0) ? move : 0; if (p.wjLock > 0) p.wjLock -= dt;
  if (p.grounded && p.dash <= 0) p.dashAvail = true;
  if (p.grounded && p.vy >= -0.1){
    p.coyote = COYOTE; p.jumps = 1;
    if (solidPt(p.x-p.hw, p.y+p.hh+0.1) && solidPt(p.x+p.hw, p.y+p.hh+0.1) && !spikes.some(s => Math.hypot(s.x-p.x, s.y-p.y) < 1.6)) p.safe = {x:p.x, y:p.y};
  } else p.coyote -= dt;
  p.buf -= dt; if (p.stun > 0) p.stun -= dt; if (p.invul > 0) p.invul -= dt;
  if (p.dashCD > 0) p.dashCD -= dt; if (p.star > 0) p.star -= dt;

  if (p.stun <= 0 && p.dash <= 0 && !(p.wjLock > 0)){
    let target = move*SPEED*(1+0.06*SH("spd")); let rate = Math.abs(move) > 0.05 ? ACC : DEC; if (!p.grounded) rate *= AIR; else if (th.key === "ice") rate *= 0.22; else if (th.key === "swamp") target *= 0.85;
    if (th.key === "cloud" && !p.grounded) p.vx += Math.sin(st.time*0.6)*5*dt; if (th.key === "desert") p.vx += Math.sin(st.time*0.45)*3.2*dt;
    const d = target - p.vx; p.vx += Math.max(-rate*dt, Math.min(rate*dt, d));
  }
  if (p.buf > 0 && p.control){
    if (p.coyote > 0){ p.vy = -JUMP*(1+0.06*SH("jmp")); p.coyote = 0; p.buf = 0; p.cut = false; SFX.jump(); burst(p.x,p.y+p.hh,4,["#e8e0c8"],2,0.3,0); }
    else if (p.wall){ burst(p.x+p.wall*p.hw,p.y,6,["#e8e0c8","#fff"],3,0.35,2); p.vy = -JUMP*0.95*(1+0.06*SH("jmp")); p.vx = -p.wall*7.5; p.facing = -p.wall; p.wjLock = 0.16; p.jumps = 1; p.dashAvail = true; p.buf = 0; p.cut = false; p.wall = 0; SFX.jump(); }
    else if (p.jumps > 0){ p.vy = -JUMP*0.92*(1+0.06*SH("jmp")); p.jumps--; p.buf = 0; p.cut = false; SFX.djump(); burst(p.x,p.y+p.hh,6,["#fff","#9fd8ff"],3,0.35,4); }
  }
  if (p.cut){ if (p.vy < 0) p.vy *= 0.5; p.cut = false; }
  if (dashPressed && p.control && p.stun <= 0 && p.dashCD <= 0 && p.dashAvail && p.dash <= 0){
    p.dash = DASHT; p.dashCD = DASHCD*(1-0.12*SH("dcd")); p.dashAvail = false; p.dashDir = move !== 0 ? move : p.facing; p.facing = p.dashDir; SFX.dash();
  }
  if (p.throwCD > 0) p.throwCD -= dt;
  if (throwPressed && p.control && p.stun <= 0 && st.state === "play" && p.throwCD <= 0){
    if (st.ammo > 0){ st.ammo--; p.throwCD = 0.32; pshots.push({ x:p.x+p.facing*0.45, y:p.y-0.15, vx:p.facing*12.5, vy:-2.5, rot:0, life:1.6 }); SFX.throw(); }
    else { p.throwCD = 0.6; SFX.alert(); addPopup("Balta yok!", p.x, p.y-0.8, false); }
  }
  p.vy += G*(st.lowG > 0 ? 0.55 : th.key === "void" ? 0.8 : th.key === "cloud" ? 0.88 : 1)*(p.vy > 0 ? FALL : 1)*dt;
  if (p.vy > MAXFALL) p.vy = MAXFALL;
  if (th.key === "cloud" && !p.grounded && p.vy > 2 && down("Space","KeyW","ArrowUp","TouchJump")){ p.vy = 2; if (Math.random() < dt*20) burst(p.x, p.y+p.hh, 1, ["#fff","#cfe0ff"], 0.8, 0.4, -1, 2); }
  if (p.wall && p.vy > 2.8){ p.vy = 2.8; if (Math.random() < dt*25) burst(p.x+p.wall*p.hw, p.y, 1, ["#e8e0c8"], 0.8, 0.3, 0, 2); }
  if (p.dash > 0){
    p.dash -= dt; p.vx = p.dashDir*15; p.vy = 0;
    burst(p.x - p.dashDir*0.2, p.y, 1, ["#9fd8ff","#fff"], 0.5, 0.3, 0, 3);
    if (p.dash <= 0) p.vx = p.dashDir*SPEED;
  }
  p.preVy = p.vy;
  moveBox(p, dt);
  if (p.grounded && Math.abs(p.vx) > 3.5 && Math.random() < dt*22) burst(p.x-Math.sign(p.vx)*0.2, p.y+p.hh, 1, ["#e8e0c8","#c8c0a8"], 1, 0.3, -1, 2);
  if (p.preVy > 7 && p.vy === 0) burst(p.x, p.y+p.hh, 7, ["#e8e0c8","#c8c0a8"], 2.5, 0.35, 2);

  if (p.y > KILLY && st.state === "play"){
    st.hp--; SFX.hit(); st.flash = 0.25;
    if (st.hp <= 0){ p.y = KILLY; killPlayer(); return; }
    p.x = p.safe.x; p.y = p.safe.y; p.vx = p.vy = 0; p.invul = INVUL; p.stun = 0.1; p.dash = 0;
  }

  // nesneler
  for (const s of spikes) if (nearP(s) && overlap(p, s.x, s.y+0.22, 0.375, 0.2)) damagePlayer(s.x);
  for (const t of turrets.slice()) if (nearP(t) && overlap(p, t.x, t.y+0.15, 0.4, 0.35)){
    const stomp = p.vy > 0 && p.y < t.y-0.1;
    if (stomp || p.dash > 0 || p.star > 0){ if (!(t.hc > 0)){ hitTurret(t, stomp ? 1 : 2); if (stomp){ p.vy = -10; p.jumps = 1; p.dashAvail = true; } } }

  for (let i = coins.length-1; i >= 0; i--){
    if (!nearP(coins[i])) continue;
    const c = coins[i], cx = Math.max(p.x-p.hw, Math.min(c.x, p.x+p.hw)), cy = Math.max(p.y-p.hh, Math.min(c.y, p.y+p.hh));
    if (Math.hypot(c.x-cx, c.y-cy) < 0.4+0.35*SH("mag")){ st.coins++; st.score += c.value; addPopup("+"+c.value, c.x, c.y, false); SFX.coin(); burst(c.x,c.y,6,["#ffd940","#fff"],3,0.4,6); coins.splice(i,1); }
  }
  for (let i = keyItems.length-1; i >= 0; i--){
    const k = keyItems[i]; if (!nearP(k)) continue;

    }
  }
  for (let i = pows.length-1; i >= 0; i--){
    const w = pows[i]; if (!nearP(w)) continue;
    if (Math.abs(p.x-w.x) < p.hw+0.4 && Math.abs(p.y-w.y) < p.hh+0.4){
      if (w.kind === "heart"){ if (st.hp < st.maxHp){ st.hp++; addPopup("+1 CAN", w.x, w.y, true); } else { st.score += 100; addPopup("+100", w.x, w.y, true); } }
      else if (w.kind === "ammo"){ st.ammo = Math.min(st.ammoMax, st.ammo+3); addPopup("+3 balta", w.x, w.y, true); }
      else { p.star = 3+0.5*SH("star"); addPopup("YENİLMEZ!", w.x, w.y, true); }
      SFX.power(); burst(w.x,w.y,14,w.kind==="heart"?["#ed3350","#fff"]:["#ffd940","#fff"],4,0.6,6); pows.splice(i,1);
    }

function updateEnemy(e, dt){

const tp = new Map();

    const now = held.has(code);
    if (now && !keys[code]){ if (code === "TouchJump") jumpPressed = true; if (code === "TouchDash") dashPressed = true; if (code === "TouchThrow") throwPressed = true; }

const padPrev = {};

function updateCamera(dt, snap){
  const p = player, ax = Math.abs(p.vx), fast = ax > SPEED*1.05 ? 1 : 0;
  const la = Math.sign(p.vx) * clamp((ax-1.5)/(SPEED-1.5), 0, 1) * (1.4+1.8*fast);

      if (hit("ArrowLeft","KeyA")){ shopTab = (shopTab+3)%4; shopSel = 0; }

    if (hit("ArrowRight","KeyD")){ sel = (sel+1) % LEVELS.length; toTitle(); }

    if (hit("ArrowDown","KeyS")) setDiff((diff+1)%4);
    if (hit("Enter","Space")){
      if (sel < unlocked()){ run = newRun(); loadLevel(sel, {score:0}); updateCamera(1,true); } else SFX.alert();
    }
    return;
  }
  if (hit("Escape")){ if (s === "play") st.paused = !st.paused; else { toTitle(); return; } }
  if (hit("KeyQ") && st.paused){ toTitle(); return; }

function start(){

}

let active=false,peer=null,conns={},hostConn=null,isHost=false,myId="",code="",state="menu",mode="1v1",players={},order=[];

function loadPeer(cb){if(window.Peer)return cb();const s=document.createElement("script");s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";s.onload=cb;s.onerror=()=>toast("PeerJS yüklenemedi (internet / engelleyici?)");document.head.appendChild(s)}
function bc(m){for(const id in conns){const c=conns[id];if(c&&c.open)try{c.send(m)}catch(e){}}}
function toHost(m){if(hostConn&&hostConn.open)try{hostConn.send(m)}catch(e){}}
function cleanup(){const p=peer;peer=null;conns={};hostConn=null;isHost=false;players={};order=[];state="menu";M=null;try{p&&p.destroy()}catch(e){}}
function leave(){cleanup();panel("pvm")}

function getNick(){nick=($("pvn").value.trim()||"Oyuncu"+(Math.random()*90+10|0)).slice(0,12);try{localStorage.setItem("pvp_nick",nick)}catch(e){}}
function createRoom(){if(peer)return;getNick();loadPeer(()=>tryCreate(0))}
function tryCreate(n){
  code="";for(let i=0;i<5;i++)code+="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.random()*32|0];
  const p=peer=new Peer(PREFIX+code);
  p.on("open",id=>{myId=id;isHost=true;players={};order=[];addPlayer(id,nick);state="lobby";panel("pvl");lobbyBC()});
  p.on("connection",cn=>{cn.on("data",d=>hostData(cn,d));cn.on("close",()=>dropPlayer(cn.peer));cn.on("error",()=>dropPlayer(cn.peer))});
  p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
  p.on("error",e=>{if(e.type==="unavailable-id"&&n<5){peer=null;try{p.destroy()}catch(x){}tryCreate(n+1)}else{toast("Bağlantı hatası: "+e.type);if(state==="menu")cleanup()}});
}
function joinRoom(){if(peer)return;getNick();code=$("pvj").value.trim().toUpperCase();if(code.length<3)return toast("Oda kodunu gir");
  loadPeer(()=>{const p=peer=new Peer();
    p.on("open",id=>{myId=id;const cn=hostConn=p.connect(PREFIX+code,{reliable:true,serialization:"json"});
      const to=setTimeout(()=>{if(state==="menu"&&peer===p){toast("Odaya bağlanılamadı");cleanup()}},10000);
      cn.on("open",()=>{clearTimeout(to);lastMsg=now();cn.send({t:"hello",name:nick})});
      cn.on("data",onHostMsg);cn.on("close",()=>hostLost("Host bağlantısı koptu, oda kapandı"));cn.on("error",()=>hostLost("Bağlantı hatası"))});
    p.on("error",e=>{toast(e.type==="peer-unavailable"?"Oda bulunamadı":"Hata: "+e.type);if(state==="menu")cleanup()})})}
function addPlayer(id,name){players[id]=mkP(id,name,0,0);order.push(id);assignTeams()}
function hostData(cn,d){if(!d||typeof d!=="object")return;const id=cn.peer;
  if(d.t==="hello"){if(state!=="lobby"||order.length>=6){cn.send({t:"deny",r:state!=="lobby"?"Maç başlamış":"Oda dolu"});setTimeout(()=>{try{cn.close()}catch(e){}},400);return}
    if(players[id])return;conns[id]=cn;addPlayer(id,String(d.name||"Oyuncu").slice(0,12));lobbyBC();return}
  const p=players[id];if(!p)return;p.seen=now();
  if(d.t==="st"){if(state==="game"&&p.alive&&d.ep===p.ep&&[d.x,d.y,d.vx,d.vy].every(Number.isFinite)){p.x=clamp(d.x,0,MW-1);p.y=clamp(d.y,0,MH+2);p.vx=clamp(d.vx,-30,30);p.vy=clamp(d.vy,-30,30);p.f=d.f<0?-1:1;p.gr=!!d.g}}
  else if(d.t==="atk"&&state==="game")doAttack(p);else if(d.t==="chat"&&state==="game")hostChat(id,d.m)}
function dropPlayer(id){const p=players[id];if(!p)return;const nm=p.name;delete players[id];order=order.filter(x=>x!==id);
  if(conns[id]){try{conns[id].close()}catch(e){}delete conns[id]}
  bc({t:"left",name:nm});toast(nm+" bağlantısı koptu");
  if(state==="lobby"){assignTeams();lobbyBC()}
  else if(state==="game"){const al=order.map(i=>players[i]);
    if(order.length<2||(mode==="2v2"&&(!al.some(q=>q.team===0)||!al.some(q=>q.team===1))))endMatch(order.length?(mode==="2v2"?TN[al[0].team]+" TAKIM":al[0].name)+" KAZANDI (rakip ayrıldı)":"Maç iptal edildi")}}
function lobbyBC(){bc({t:"lobby",mode,map:mapSel,code,players:order.map(id=>({id,name:players[id].name,team:players[id].team,idx:players[id].idx}))});renderLobby()}
function renderLobby(){$("pvcode").textContent=code;
  $("pvpl").innerHTML=order.map((id,i)=>{const p=players[id];return '<div style="font-size:20px"><span style="color:'+col(p)+'">●</span> '+esc(p.name)+(i===0?" 👑":"")+(id===myId?" (sen)":"")+(mode==="2v2"?" — "+TN[p.team]:"")+"</div>"}).join("");
  const m=MODES[mode],ok=order.length>=m.min&&order.length<=m.max;$("pvmode").value=mode;$("pvmap").value=mapSel;$("pvmap").disabled=!isHost;$("pvmode").disabled=!isHost;$("pvst").style.display=isHost?"":"none";$("pvst").disabled=!ok;
  $("pvinfo").textContent=(ok?(isHost?"Hazır, başlatabilirsin":"Host'un başlatması bekleniyor"):m.n+" için "+(m.min===m.max?m.min:m.min+"-"+m.max)+" oyuncu gerekli")+"  ("+order.length+"/6)"}
function onHostMsg(d){if(!d||typeof d!=="object")return;lastMsg=now();
  switch(d.t){
   case"deny":toast(d.r);cleanup();break;
   case"lobby":mode=d.mode;mapSel=d.map||"auto";code=d.code;order=d.players.map(x=>x.id);players={};d.players.forEach(x=>players[x.id]=mkP(x.id,x.name,x.team,x.idx));state="lobby";panel("pvl");renderLobby();break;
   case"start":mode=d.mode;mapSel=d.map||"auto";initMatch();players={};order=[];d.players.forEach(x=>{const p=players[x.id]=mkP(x.id,x.name,x.team,x.idx);p.x=p.rx=x.x;p.y=p.ry=x.y;order.push(x.id)});state="game";begin();break;
   case"sn":if(state==="game")applySnap(d);break;
   case"end":if(state!=="end"){state="end";showEnd(d)}break;
   case"hit":case"kill":case"resp":case"left":case"bnc":case"frz":case"chat":onEvent(d);break}}
function applySnap(d){
  for(const a of d.p){const q=players[a[0]];if(!q)continue;q.hp=a[4];q.alive=!!a[5];q.w=a[6];q.ammo=a[7];q.kills=a[8];q.deaths=a[9];q.resp=a[14];q.invf=a[15];
    if(a[0]!==myId){q.x=a[1];q.y=a[2];q.f=a[3];q.vx=a[10];q.vy=a[11];q.gr=!!a[12];if(a[13])q.sw=Math.max(q.sw,.15)}}
  proj=d.pr.map(a=>({id:a[0],x:a[1],y:a[2],vx:a[3],vy:a[4],k:a[5],g:a[6]}));picks=d.pk.map(a=>({id:a[0],x:a[1],y:a[2],k:a[3]}));tscore=d.ts}
function snap(){bc({t:"sn",p:order.map(id=>{const q=players[id];return[id,r2(q.x),r2(q.y),q.f,q.hp,q.alive?1:0,q.w,q.ammo,q.kills,q.deaths,r2(q.vx),r2(q.vy),q.gr?1:0,q.sw>0?1:0,Math.ceil(Math.max(0,q.resp)),q.inv>0?1:0]}),
  pr:proj.map(o=>[o.id,r2(o.x),r2(o.y),o.vx,o.vy,o.k,o.g]),pk:picks.map(k=>[k.id,k.x,k.y,k.k]),ts:tscore})}
function evt(m){bc(m);onEvent(m)}
function onEvent(m){
  if(m.t==="hit"){const q=players[m.id];if(!q)return;for(let i=0;i<8;i++)parts.push({x:q.x,y:q.y,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:.5,c:i%2?"#fff":"#ed3350"});
    if(m.id===myId){q.vx=m.kx;q.vy=m.ky;q.kb=.2}}
  else if(m.t==="kill"){feed.push({t:now(),s:m.a+" ⚔ "+m.b+(m.s>=3?"  🔥 "+m.s+" SERİ!":"")});for(const i of order){const x=players[i];if(!x)continue;if(x.name===m.a)x.st=m.s||0;else if(x.name===m.b)x.st=0}}
  else if(m.t==="bnc"){const q=players[m.id];if(q&&m.id===myId){q.vy=-10;q.jumps=1;q.coy=0}for(let i=0;i<6;i++)parts.push({x:q?q.x:0,y:q?q.y+.4:0,vx:(Math.random()-.5)*5,vy:Math.random()*2,l:.35,c:"#fff"})}
  else if(m.t==="frz"){const q=players[m.id];if(q){q.fz=1.8;for(let i=0;i<10;i++)parts.push({x:q.x,y:q.y,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:.5,c:i%2?"#bff4ff":"#fff"})}}
  else if(m.t==="resp"){const q=players[m.id];if(q)q.fz=0;if(q&&m.id===myId){q.x=m.x;q.y=m.y;q.vx=q.vy=0;q.ep=m.ep;q.alive=true}}
  else if(m.t==="chat"){const q=players[m.id];if(q)q.chat={m:String(m.m).slice(0,60),t:now()}}
  else if(m.t==="left")toast(m.name+" bağlantısı koptu")}

// ---------- maç (host) ----------
function initMatch(){ak=mapSel==="auto"?MODES[mode].arena:mapSel;M=ARENAS[ak];MW=M[0].length;MH=M.length;spawns=[];wspots=[];
  M.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==="S")spawns.push([c,r]);else if(WC[ch])wspots.push({c,r,k:WC[ch],t:0})}));
  for(const dc of[-3,3]){const c=(MW>>1)+dc;let r=1;while(r<MH-1&&M[r][c]!=="#")r++;if(r<MH-1&&M[r-1][c]==="."&&!wspots.some(w=>Math.hypot(w.c-c,w.r-(r-1))<2.5))wspots.push({c,r:r-1,k:"ice",t:0})}
  proj=[];picks=[];parts=[];feed=[];tscore=[0,0]}
function hostStart(){const m=MODES[mode];if(state!=="lobby"||order.length<m.min||order.length>m.max)return;
  initMatch();const ss=[...spawns].sort((a,b)=>a[0]-b[0]),hf=ss.length>>1,pool=[ss.slice(0,hf),ss.slice(hf)],tn=[0,0];
  order.forEach((id,i)=>{const p=players[id],s=mode==="2v2"?pool[p.team][tn[p.team]++%pool[p.team].length]:spawns[i%spawns.length];players[id]=Object.assign(mkP(id,p.name,p.team,p.idx),{x:s[0],y:s[1]+.06,rx:s[0],ry:s[1]+.06})});
  state="game";bc({t:"start",mode,map:mapSel,players:order.map(id=>{const p=players[id];return{id,name:p.name,team:p.team,idx:p.idx,x:p.x,y:p.y}})});begin()}
function begin(){panel(null);if(document.activeElement)document.activeElement.blur();if(isHost){snT=0;wspots.forEach(w=>w.t=WR[w.k][0])}}
function spawnPick(){}
function doAttack(p){if(!p.alive||p.cd>0)return;const w=WP[p.w];p.cd=w.cd;p.sw=.2;
  if(w.melee){for(const id of order){const q=players[id];if(q.alive&&canHit(p,q)){const dx=(q.x-p.x)*p.f;if(dx>-.3&&dx<w.rng+.3&&Math.abs(q.y-p.y)<.9)hurt(q,p,w.dmg,p.f)}}}
  else{const n=w.pel||1;for(let i=0;i<n;i++)proj.push({id:++pid,o:p.id,x:p.x+p.f*.5,y:p.y-.1,vx:p.f*w.sp,vy:(p.w==="axe"?-5:0)+(n>1?(i-1)*2.2:0)+(w.spr?(Math.random()-.5)*w.spr:0),g:w.g,k:p.w,dmg:w.dmg,life:w.life||2.5});if(--p.ammo<=0)p.w="fist"}}
function hurt(q,src,dmg,dir){if(!q.alive||q.inv>0||q.hit>0)return;q.hp-=dmg;q.hit=.15;evt({t:"hit",id:q.id,kx:dir*7,ky:-6});
  if(q.hp<=0){q.hp=0;q.alive=false;q.resp=3;q.deaths++;q.w="fist";q.ammo=0;q.st=0;q.fz=0;if(src&&src.id!==q.id){src.kills++;src.st=(src.st||0)+1;if(mode==="2v2")tscore[src.team]++}
    evt({t:"kill",a:src?src.name:"?",b:q.name,s:src&&src.id!==q.id?src.st:0});checkWin()}}
function checkWin(){const g=MODES[mode].goal;
  if(mode==="2v2"){for(let t=0;t<2;t++)if(tscore[t]>=g)return endMatch(TN[t]+" TAKIM KAZANDI!")}
  else for(const id of order)if(players[id].kills>=g)return endMatch(players[id].name+" KAZANDI!")}
function endMatch(txt){if(state!=="game")return;state="end";const m={t:"end",txt,board:order.map(id=>{const p=players[id];return[p.name,p.team,p.kills,p.deaths,col(p)]})};bc(m);showEnd(m)}
function respawn(q){let best=spawns[0],bd=-1;for(const s of spawns){let m=99;for(const id of order){const o=players[id];if(o!==q&&o.alive)m=Math.min(m,Math.hypot(o.x-s[0],o.y-s[1]))}m+=Math.random();if(m>bd){bd=m;best=s}}
  q.hp=HP0;q.alive=true;q.inv=1.5;q.ep++;q.x=best[0];q.y=best[1]+.06;q.vx=q.vy=0;evt({t:"resp",id:q.id,x:q.x,y:q.y,ep:q.ep})}
function hostSim(h){
  for(const id of order){const q=players[id];if(!q)continue;q.cd-=h;q.inv-=h;q.hit-=h;q.stc=(q.stc||0)-h;if(!q.alive){q.resp-=h;if(q.resp<=0)respawn(q)}}
  for(let i=proj.length-1;i>=0;i--){const o=proj[i];o.vy+=o.g*h;o.x+=o.vx*h;o.y+=o.vy*h;o.life-=h;let dead=o.life<=0||solid(Math.floor(o.x+.5),Math.floor(o.y+.5));

// ---------------------------------------------------------------- yardımcılar
function summon(b, cnt, kind){
  for (let i = 0; i < cnt; i++){
    if (enemies.filter(e => !e.dead).length >= 3) return;
    const r = kind === "W" ? 6 : 10, x = clamp(Math.round(b.x+(i%2 ? 1 : -1)*(5+R()*3)), 3, MW-4);
    enemies.push(makeEnemy(x, r, kind)); burst(x, r, 10, [b.def.col, "#fff"], 3, 0.5, 0);
  }
}
function entrance(b){
  if (b.kind === "sky"){ b.y = -3; b.t = 2.4; }
  else {
    const clear = x => { for (let c = Math.floor(x-b.hw+0.5); c <= Math.floor(x+b.hw+0.5-1e-4); c++){ for (let r = 0; r <= 9; r++) if (solidAt(c, r)) return false; if (!solidAt(c, 11)) return false; } return true; };
    for (let d = 0; d <= 14; d++){ const x = b.x + (d % 2 ? 1 : -1)*Math.ceil(d/2); if (x > 3 && x < MW-4 && clear(x)){ b.x = x; b.homeX = x; break; } }
    b.y = -4; b.vy = 0; b.state = "air"; b.air = 0; b.t = 1;
  }
}

// ---------------------------------------------------------------- ÖZEL SALDIRILAR
sig = function(b, enr){
  const p = player, k = b.k, col = b.def.col, art = b.def.art, d0 = b.dir < 0 ? -1 : 1, top = cam.y-7;
  const later = (t, fn) => (b.q2 = b.q2 || []).push({t, fn});
  const say = s => addPopup(s, b.x, b.y-b.hh-1.3, true);
  const n = (a, c) => enr ? c : a;
  const go = (vx, vy, g, x0, y0, life, c) => { shoot("fire", x0 === undefined ? b.x : x0, y0 === undefined ? b.y : y0, vx, vy, 0.3, 0.3, life || 5, c || col); shots[shots.length-1].g = g || 0; };
  const aim = () => Math.atan2(p.y-b.y, p.x-b.x);
  const rock = (x, c, v0) => shoot("rock", clamp(x, 2, MW-3), top, 0, v0 || 0, 0.35, 0.35, 6, c || col);
  const strike = (x, w, c) => { x = clamp(x, 2, MW-3); warn(x, 0, w, c || col, "col"); later(w, () => rock(x, c, 10)); };
  const erupt = (x, w, c, cnt, sp) => { x = clamp(x, 2, MW-3); warn(x, 10.5, w, c, "floor"); later(w, () => { for (let i = 0; i < cnt; i++) go((R()-0.5)*1.5, -(sp+i*1.6), 18, x+(R()-0.5)*0.3, 10.3, 1.3, c); st.shake = Math.max(st.shake, 0.15); SFX.slam(); }); };
  const ring = (cnt, sp, off) => { for (let i = 0; i < cnt; i++){ const a = i/cnt*2*PI+(off || 0); go(Math.cos(a)*sp, Math.sin(a)*sp); } SFX.shoot(); };
  const fan = (cnt, spread, sp, base) => { for (let i = 0; i < cnt; i++){ const a = base+(cnt > 1 ? (i/(cnt-1)-0.5)*spread : 0); go(Math.cos(a)*sp, Math.sin(a)*sp); } SFX.shoot(); };
  const sel = ((b.sc = (b.sc || 0)+1)-1) % 3;
  b.relT = 0.3;
  switch (art){
    case "mush":
      if (sel === 0){ say("SPOR PATLAMASI"); SFX.shoot(); const c = n(5,7); for (let i = 0; i < c; i++) go((i-(c-1)/2)*2.1+(R()-0.5), -9-R()*3, 14, b.x, b.y-b.hh*0.5, 4, i%2 ? "#c070ff" : "#e03a3a"); }
      else if (sel === 1){ say("SPOR MANTARLARI"); for (let i = -1; i <= 1; i++) erupt(p.x+i*3.2+(R()-0.5), 0.8, "#c070ff", n(3,4), 9); }
      else { say("MANTAR ORDUSU"); summon(b, n(1,2), "E"); groundWaves(b, 6*k); }
      break;
    case "golem":
      if (sel === 0){ say("TAŞ ÇIĞI"); const dr = p.x >= b.x ? 1 : -1; for (let i = 0; i < n(4,6); i++) later(i*0.2, () => rock(b.x+dr*(2.5+i*2.5))); groundWaves(b, 6*k); }
      else if (sel === 1){ say("TAŞ SÜTUNLARI"); for (let i = -1; i <= 1; i++) erupt(p.x+i*3, 0.8, "#9a9ab8", 3, 10); }
      else if (enr){ say("DEPREM!"); st.shake = Math.max(st.shake, 0.6); for (let i = 0; i < 8; i++) later(i*0.16, () => rock(p.x+(R()-0.5)*14)); }
      else { say("TAŞ DARBESİ"); strike(p.x, 0.7); strike(p.x+3.5, 0.9); strike(p.x-3.5, 0.9); }
      break;
    case "dragon":
      if (sel === 0){ say("ATEŞ NEFESİ"); SFX.shoot(); for (let i = 0; i < n(12,16); i++) later(i*0.06, () => { const a = (d0 > 0 ? 0.1 : PI-0.1)+(R()-0.5)*0.55, sp = (6+R()*4)*k; go(Math.cos(a)*sp, Math.sin(a)*sp, 0, b.x+d0*b.hw*0.9, b.y-b.hh*0.2, 1.1, i%2 ? "#ffd040" : "#ff5a20"); }); }
      else if (sel === 1){ say("LAV YAĞMURU"); SFX.shoot(); const c = n(5,8); for (let i = 0; i < c; i++) go((p.x+(i-(c-1)/2)*2.2-b.x)/1.375, -11, 16, b.x, b.y-b.hh*0.6, 2.6, i%2 ? "#ffd040" : "#ff5a20"); }
      else if (enr){ say("ALEV HALKASI"); ring(14, 4.2*k, b.tt); groundWaves(b, 7*k); }
      else { say("ATEŞ TOPLARI"); fan(5, 0.9, 7.5*k, aim()); }
      break;
    case "yeti":
      if (sel === 0){ say("KAR TOPU"); const c = n(3,5); for (let i = 0; i < c; i++) later(i*0.22, () => { go((p.x-b.x)/1.33+(i-(c-1)/2)*1.8, -8, 12, b.x, b.y-b.hh*0.5, 3, "#dff4ff"); SFX.throw(); }); }
      else if (sel === 1){ say("BUZ SİVRİLERİ"); const c = n(3,5); for (let i = 0; i < c; i++) strike(p.x+(i-(c-1)/2)*3+(R()-0.5), 0.8, "#bfe8ff"); }
      else if (enr){ say("DONDURUCU NEFES"); SFX.shoot(); for (let i = 0; i < 14; i++) later(i*0.07, () => { const a = (d0 > 0 ? 0 : PI)+(R()-0.5)*0.9; go(Math.cos(a)*5.2*k, Math.sin(a)*5.2*k, 0, b.x+d0*b.hw, b.y-b.hh*0.3, 1.6, "#9fe0ff"); }); groundWaves(b, 6*k); }
      else { say("BUZ DALGASI"); groundWaves(b, 7*k); strike(p.x, 0.7, "#bfe8ff"); }
      break;
    case "scorp":
      if (sel === 0){ say("ATILMA!"); SFX.alert(); const ch = () => { b.state = "charge"; b.t = 1.1; b.dir = p.x >= b.x ? 1 : -1; SFX.dash(); };
        later(0.55, ch); if (enr) later(2.1, () => { if (b.state === "idle" || b.state === "walk") ch(); }); }
      else if (sel === 1){ say("ZEHİRLİ SOKMA"); for (let i = 0; i < n(3,5); i++) later(i*0.25, () => { const sx = b.x+b.dir*b.hw, sy = b.y-b.hh*0.6, a = Math.atan2(p.y-sy, p.x-sx); go(Math.cos(a)*9*k, Math.sin(a)*9*k, 0, sx, sy, 3, "#a0ff40"); SFX.shoot(); }); }
      else { say("KUM SÜTUNLARI"); for (let i = -1; i <= 1; i++) erupt(p.x+p.vx*0.5+i*3.4, 0.75, "#e0902f", 3, 9); }
      break;
    case "frog":
      if (sel === 0){ say("DİL ATIŞI"); for (let i = 0; i < n(2,3); i++) later(i*0.35, () => { shoot("wave", b.x+b.dir*b.hw, b.y+0.3, b.dir*13, 0, 0.4, 0.3, 0.6, "#e04a6a"); SFX.dash(); }); }
      else if (sel === 1){ say("ZEHİR TÜKÜRÜĞÜ"); const c = n(3,5); for (let i = 0; i < c; i++) later(i*0.2, () => { go((p.x-b.x)/1.1+(i-(c-1)/2)*1.7, -8, 14, b.x, b.y-0.5, 4, "#9be84a"); SFX.throw(); }); }
      else { say("ZIPLAMA!"); b.state = "crouch"; b.t = enr ? 0.35 : 0.55; SFX.alert(); }
      break;
    case "eagle":
      if (sel === 0 || (sel === 2 && enr)){ say("SÜZÜLME!"); b.state = "sweep"; b.tx = b.x < MW/2 ? MW-3 : 3; b.t = 2; SFX.alert(); }
      else if (sel === 1){ say("TÜY YAĞMURU"); for (let i = 0; i < n(7,10); i++) later(i*0.1, () => go((R()-0.5)*4+(p.x-b.x)*0.3, 3+R()*2, 6, b.x+(R()-0.5)*b.hw*2, b.y+0.4, 3, "#ffb030")); }
      else { say("KANAT RÜZGARI"); fan(3, 0.5, 9*k, aim()); }
      break;
    case "owl":
      if (sel === 0){ say("GECE ÇIĞLIĞI"); fan(n(5,7), 1.7, 6*k, PI/2); later(0.5, () => ring(8, 3.8)); }
      else if (sel === 1){ say("SESSİZ PUSU"); b.state = "tele"; b.t = 0.9; b.tx = p.x; b.ghost = 1.4; SFX.alert(); }
      else if (enr){ say("YARASA SÜRÜSÜ"); summonBats(b, 2); }
      else { say("TÜY FIRTINASI"); fan(3, 0.6, 7*k, aim()); }
      break;
    case "crystal":
      if (sel === 0){ say("KRİSTAL FIRTINASI"); for (let w = 0; w < 3; w++) later(w*0.35, () => ring(n(8,12), (4+w)*k, w*0.4)); }
      else if (sel === 1){ say("KRİSTAL YAĞMURU"); const c = n(5,8); for (let i = 0; i < c; i++){ const x = clamp(p.x+(i-(c-1)/2)*2.8, 2, MW-3); warn(x, 0, 0.6, col, "col"); later(0.6, () => rock(x, col, 8)); } }
      else { say("AĞIRLIKSIZ!"); st.lowG = 3; SFX.power(); if (enr) ring(10, 4*k); else fan(5, 0.8, 7*k, aim()); }
      break;
    case "storm":
      if (sel === 0){ say("YILDIRIM"); SFX.alert(); const c = n(3,5); for (let i = 0; i < c; i++) strike(p.x+(i-(c-1)/2)*3.2, 0.65, "#ffe860"); }
      else if (sel === 1){ say("ŞİMŞEK ZİNCİRİ"); const dr = p.x >= b.x ? 1 : -1; for (let i = 0; i < n(6,8); i++) later(i*0.22, () => strike(b.x+dr*(2+i*3), 0.55, "#ffe860")); }
      else if (enr){ say("SAĞANAK"); for (let i = 0; i < 14; i++) later(i*0.14, () => rock(p.x+(R()-0.5)*12, "#9fb4ff", 9)); }
      else { say("ŞİMŞEK"); strike(p.x, 0.5, "#ffe860"); strike(p.x+4, 0.7, "#ffe860"); strike(p.x-4, 0.7, "#ffe860"); }
      break;
    case "wraith":
      if (sel === 0){ say("GÖLGE PUSUSU"); burst(b.x,b.y,12,["#ff4a68","#fff"],4,0.5,0); b.x = clamp(p.x+(R() < 0.5 ? -3.5 : 3.5), 2, MW-3); b.y = b.hov; burst(b.x,b.y,12,["#ff4a68","#fff"],4,0.5,0); later(0.35, () => fan(n(4,6), 0.9, 7*k, aim())); }
      else if (sel === 1){ say("RUH ÇAĞRISI"); summon(b, n(2,3), "W"); }
      else { say("KABUS DALGASI"); ring(n(10,14), 3.6*k, b.tt); later(0.5, () => fan(5, 0.8, 7*k, aim())); }
      break;
    case "sky":
      if (sel === 0){ say("GÖK SARMALI"); SFX.shoot(); for (let i = 0; i < n(14,20); i++) later(i*0.08, () => { const a = i*0.7; for (let arm = 0; arm < 2; arm++) go(Math.cos(a+arm*PI)*4.5*k, Math.sin(a+arm*PI)*4.5*k); }); }
      else if (sel === 1){ say("GÖKTAŞI YAĞMURU"); const c = n(8,12); for (let i = 0; i < c; i++){ const x = 3+((i*7)%c)*((MW-6)/(c-1)); warn(x, 0, 0.5+i*0.12, col, "col"); later(0.5+i*0.12, () => rock(x, col, 8)); } }
      else { say("YILDIZ PATLAMASI"); ring(n(10,16), 4*k, b.tt); later(0.4, () => fan(5, 0.9, 7*k, aim())); if (enr) summonBats(b, 1); }
      break;
  }
};

// yere çakılma: her boss kendi şekliyle
golemSlam = function(b, enr){
  const art = b.def.art, col = b.def.col, k = b.k, p = player;
  st.shake = Math.max(st.shake, 0.5); SFX.slam(); burst(b.x, b.y+b.hh, 16, [col, "#c8c0a8"], 5, 0.6, 10, 3);
  groundWaves(b, (enr ? 8.5 : 6.5)*k);
  const spray = (cnt, sp, c) => { for (let i = 0; i < cnt; i++){ shoot("fire", b.x+(R()-0.5)*b.hw*2, b.y+b.hh-0.5, (R()-0.5)*8, -(sp+R()*5), 0.3, 0.3, 3, c || col); shots[shots.length-1].g = 16; } };
  const rocks = (cnt, c) => { for (let i = 0; i < cnt; i++) shoot("rock", clamp(p.x+(i-(cnt-1)/2)*3.2+(R()-0.5), 2, MW-3), cam.y-7, 0, 0, 0.35, 0.35, 6, c || col); };
  if (art === "mush") spray(enr ? 8 : 5, 8, "#c070ff");
  else if (art === "golem") rocks(enr ? 4 : 2);
  else if (art === "dragon") spray(enr ? 9 : 6, 9, "#ff5a20");
  else if (art === "yeti") rocks(enr ? 3 : 2, "#bfe8ff");
  else if (art === "scorp") spray(5, 7, "#e0902f");
  else if (art === "frog"){ spray(6, 7, "#9be84a"); if (enr) (b.q2 = b.q2 || []).push({t:0.1, fn:() => { if (b.state === "idle"){ b.state = "crouch"; b.t = 0.3; } }}); }
};

// gökteki bosslar: normal atışlar da ayrı
const _fa = fireAt;
fireAt = function(b, enr){
  const p = player, k = b.k, col = b.def.col, a = b.def.art, base = Math.atan2(p.y-b.y, p.x-b.x);
  const go = (an, sp, c) => { shoot("fire", b.x, b.y+0.3, Math.cos(an)*sp*k, Math.sin(an)*sp*k, 0.3, 0.3, 5, c || col); };
  if (a === "eagle"){ [-0.12,0.12].forEach(o => go(base+o, 9)); if (enr) go(base, 11); }
  else if (a === "owl"){ [-0.4,0,0.4].forEach(o => go(base+o, 5)); }
  else if (a === "crystal"){ for (let i = 0; i < 4; i++) go(b.tt+i*PI/2, 5.5); }
  else if (a === "storm"){ const x = clamp(p.x, 2, MW-3); warn(x, 0, 0.5, col, "col"); TQ.push({t:0.5, fn:() => shoot("rock", x, cam.y-7, 0, 8, 0.35, 0.35, 6, col)}); SFX.alert(); return; }
  else if (a === "wraith"){ go(base, 7.5); go(base+0.5, 4); go(base-0.5, 4); }
  else if (a === "sky"){ [-0.5,0.5].forEach(o => go(base+o, 6.5)); if (enr) go(base, 8); }
  else return _fa(b, enr);
  SFX.shoot();
};

// ---------------------------------------------------------------- BOSS GÜNCELLEME
const _ub = updateBoss;
updateBoss = function(b, dt){
  _ub(b, dt);
  if (b.gone || b.sleep) return;
  if (b.dead){ b.q2 = null; if (!b.dd){ b.dd = 1; TQ.length = 0; WN.length = 0; burst(b.x, b.y, 50, [b.def.col, "#fff", "#ffd940"], 8, 1.2, 6, 3); } return; }
  if (b.relT > 0) b.relT -= dt;
  if (b.ghost > 0) b.ghost -= dt;
  if (b.mini) return;
  const col = b.def.col, s = b.state;
  if (b.phase === 2 && !b.p2){            // ÖFKE MODU
    b.p2 = 1; b.k *= 1.12; b.inv = Math.max(b.inv, 1.2); b.q2 = null; shots.length = 0; TQ.length = 0; WN.length = 0;
    st.shake = Math.max(st.shake, 0.8); st.big = {t:1.6, txt:"ÖFKE MODU!", col}; SFX.slam();
    burst(b.x, b.y, 30, [col, "#fff", "#ff3030"], 7, 0.8, 4, 3);
    if (b.def.art === "mush") summon(b, 2, "E"); else if (b.def.art === "wraith") summon(b, 2, "W");
  }
  if (b.q2 && !(b.tiredT > 0)) for (let i = b.q2.length-1; i >= 0; i--){ const e = b.q2[i]; e.t -= dt; if (e.t <= 0){ b.q2.splice(i,1); e.fn(); } }
  if (s === "tele" && b.kind === "sky" && b.t > 0.3) b.tx = player.x;          // pusu hedefi takip eder, sonra kilitlenir
  if (b.kind === "sky" && (s === "sweep" || s === "dive")) b.anim += dt*6;     // kanat çırpışı hızlanır
  if (parts.length > 400) return;
  if (s === "cast" || s === "tele" || s === "crouch"){
    if (R() < dt*50){ const a = R()*6.283, d = b.hw*1.6; parts.push({x:b.x+Math.cos(a)*d, y:b.y+Math.sin(a)*d, vx:-Math.cos(a)*d*3, vy:-Math.sin(a)*d*3, life:0.3, max:0.3, col, g:0, sz:2}); }
  }
  if (s === "charge" || s === "dive" || s === "sweep" || s === "swoop" || s === "lunge"){
    if (R() < dt*60) parts.push({x:b.x-b.dir*b.hw*0.7, y:b.y+(R()-0.5)*b.hh, vx:-b.dir*2, vy:(R()-0.5)*2, life:0.35, max:0.35, col, g:0, sz:3});
  }
  if (s === "walk" && b.grounded && R() < dt*10) burst(b.x, b.y+b.hh, 2, ["#c8c0a8","#8a8aa0"], 1.5, 0.3, 2);
  if (b.kind === "sky" && R() < dt*12) parts.push({x:b.x+(R()-0.5)*b.hw*2.4, y:b.y+b.hh*0.5, vx:(R()-0.5), vy:1.5+R(), life:0.4, max:0.4, col:"#ffffff", g:0, sz:1});
};

// ---------------------------------------------------------------- TEHLİKELER + GİRİŞ
function hz(dt){
  for (let i = TQ.length-1; i >= 0; i--){ const e = TQ[i]; e.t -= dt; if (e.t <= 0){ TQ.splice(i,1); e.fn(); } }
  for (let i = WN.length-1; i >= 0; i--){ WN[i].t -= dt; if (WN[i].t <= 0) WN.splice(i,1); }
  if (!live() || player.dead || !LV.hz) return;
  const p = player, f = boss.phase === 2 ? 0.7 : 1;
  LV.hz.forEach((h, i) => {
    HS[i] = (HS[i] === undefined ? 4+R()*2 : HS[i]) - dt; if (HS[i] > 0) return;
    HS[i] = h.every*f*(0.8+R()*0.4);
    if (h.t === "lowg"){ st.lowG = h.dur; addPopup("AĞIRLIKSIZ!", p.x, p.y-1.2, true); SFX.power(); return; }
    const y = h.y || 10.5, x = h.t === "geyser" ? h.cols[(R()*h.cols.length)|0] : clamp(p.x+(R()-0.5)*2*h.spread, 2, MW-3);
    if (h.t === "fall"){ warn(x, 0, h.warn, h.col, "col"); TQ.push({t:h.warn, fn:() => shoot("rock", x, cam.y-7, 0, 6, 0.3, 0.3, 6, h.col)}); return; }
    warn(x, y, h.warn, h.col, "floor");
    TQ.push({t:h.warn, fn:() => { for (let j = 0; j < h.n; j++){ shoot("fire", x+(R()-0.5)*0.4, y-0.2, (R()-0.5)*(h.t === "geyser" ? 1.2 : 2), -(h.sp+j*1.6), 0.3, 0.3, 1.4, h.col); shots[shots.length-1].g = h.g; } SFX.slam(); burst(x, y, 6, [h.col, "#fff"], 3, 0.4, 4); }});
  });
}
const _step = step;
step = function(dt){
  if (st && st.state === "play" && !st.paused && LV.boss && boss && !ent){ ent = 1; entrance(boss); }
  _step(dt);
  if (!st || st.state !== "play" || st.paused) return;
  if (LV.boss && boss && !intro && st.banner <= 0){ intro = 1; st.big = {t:2.2, txt:boss.name, col:boss.def.col}; SFX.alert(); }
  hz(dt);
};
const _ll = loadLevel;
loadLevel = function(i, o){ _ll(i, o); WN = []; TQ = []; HS = []; intro = 0; ent = 0; };

// ---------------------------------------------------------------- ÇİZİM
const casting = s => s === "cast" || s === "tele" || s === "crouch";
drawBoss = function(b, jx, alpha, tint){
  const u = b.hw*TS, art = ART[b.def.art] || ART.golem, s = b.state, T = performance.now()/1000, dir = b.dir < 0 ? -1 : 1;
  const ground = b.kind === "golem", cs = casting(s) && !b.dead, prog = clamp(1-b.t/0.7, 0, 1), bob = Math.sin(b.anim*0.5);
  const rp = b.relT > 0 ? clamp(b.relT/0.3, 0, 1) : 0, tired = (s === "stun" || s === "tired" || b.tiredT > 0);
  let sx = 1-bob*0.015, sy = 1+bob*0.025, rot = 0, oy = 0;
  if (s === "crouch"){ sy = 1-0.24*prog; sx = 1+0.16*prog; }
  else if (s === "cast" || s === "tele"){ const sh = Math.sin(T*55)*0.035*prog; if (ground){ sy = 1-0.1*prog+sh; sx = 1+0.1*prog-sh; } else sx = sy = 1+0.12*prog+sh; }
  else if (s === "walk"){ rot = Math.sin(b.anim)*0.07; oy = -Math.abs(Math.sin(b.anim))*0.06*u; }
  else if (s === "air" && ground){ const v = clamp(Math.abs(b.vy)*0.02, 0, 0.3); sy = 1+v; sx = 1/sy; }
  else if (s === "charge" || s === "lunge"){ rot = 0.22; sx = 1.12; sy = 0.9; }
  else if (s === "sweep" || s === "swoop"){ rot = 0.35; }
  else if (s === "dive"){ rot = 0.85; sx = 0.92; sy = 1.1; }
  else if (tired){ rot = Math.sin(T*8)*0.12; sy = 0.96; }
  else if (s === "hover"){ rot = Math.sin((b.tt || 0)*1.7)*0.06; }
  if (rp && !cs){ sx *= 1-0.1*rp; sy *= 1+0.12*rp; }
  if (b.hurt > 0){ rot += (R()-0.5)*0.16; sy *= 0.92; sx *= 1.06; }
  if (b.dead){ sx = sy = 1+Math.sin(T*45)*0.06; }

  bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0,0,128,128); bctx.globalAlpha = 1; bctx.globalCompositeOperation = "source-over";
  if (ground){ bctx.translate(64, 64+u+oy); bctx.rotate(rot*dir); bctx.scale(dir*u*sx, u*sy); bctx.translate(0,-1.14); }
  else { bctx.translate(64, 64+oy); bctx.rotate(rot*dir); bctx.scale(dir*u*sx, u*sy); }
  art(b.anim, b.phase === 2 || cs);
  bctx.setTransform(1,0,0,1,0,0);
  { bctx.globalCompositeOperation = "source-atop"; const bg = bctx.createLinearGradient(0,0,0,128); bg.addColorStop(0,"rgba(255,255,255,0.22)"); bg.addColorStop(0.5,"rgba(0,0,0,0)"); bg.addColorStop(1,"rgba(0,0,0,0.35)"); bctx.fillStyle = bg; bctx.fillRect(0,0,128,128); bctx.globalCompositeOperation = "source-over"; }
  if (tint){ bctx.globalCompositeOperation = "source-atop"; bctx.fillStyle = tint; bctx.fillRect(0,0,128,128); bctx.globalCompositeOperation = "source-over"; }

  const cx = Math.round((b.x+jx-cam.x)*TS + LW/2), cy = Math.round((b.y-cam.y)*TS + LH/2);
  if (cs){
    const g = vctx.createRadialGradient(cx,cy,2,cx,cy,u*1.9); g.addColorStop(0,b.def.col); g.addColorStop(1,"rgba(0,0,0,0)");
    vctx.save(); vctx.globalCompositeOperation = "lighter"; vctx.globalAlpha = 0.15+0.45*prog; vctx.fillStyle = g; vctx.fillRect(cx-u*2, cy-u*2, u*4, u*4); vctx.restore();
  }
  vctx.globalAlpha = alpha*(b.ghost > 0 ? 0.28 : 1); vctx.drawImage(bcv, cx-64, cy-64); vctx.globalAlpha = 1;
  if (tired && !b.dead){
    vctx.fillStyle = "#ffe060";
    for (let i = 0; i < 3; i++){ const a = T*5+i*2.094; vctx.fillRect(Math.round(cx+Math.cos(a)*u*0.7), Math.round(cy-b.hh*TS-5+Math.sin(a)*3), 3, 3); }
  }
};

const _rw = renderWorld;
renderWorld = function(){
  _rw();
  if (!st || !LV || !LV.boss || !player) return;
  const t = performance.now()/1000, SX = x => (x-cam.x)*TS+LW/2, SY = y => (y-cam.y)*TS+LH/2;
  if (LV.lava) for (const [c0, c1] of LV.lava){           // lav çukurları
    const x = Math.round(SX(c0-0.5)), w = (c1-c0+1)*TS, y = Math.round(SY(11.5)); if (x > LW || x+w < 0) continue;
    const g = vctx.createLinearGradient(0,y,0,y+34); g.addColorStop(0,"#ffd040"); g.addColorStop(0.25,"#ff5a20"); g.addColorStop(1,"#6a0c08");
    vctx.fillStyle = g; vctx.fillRect(x, y+2, w, LH-y);
    vctx.fillStyle = "#ffe080"; for (let i = 0; i < w; i += 4) vctx.fillRect(x+i, y+1+Math.round(Math.sin(t*3+i*0.7)*1.5), 3, 2);
  }
  for (const w of WN){                                      // uyarı işaretleri
    const f = 1-w.t/w.m, a = (0.25+0.5*Math.abs(Math.sin(t*14)))*(0.4+0.6*f), x = Math.round(SX(w.x));
    vctx.fillStyle = w.c; vctx.globalAlpha = a;
    if (w.k === "col"){ vctx.fillRect(x-1, 0, 2, Math.round(SY(10.5))); vctx.fillRect(x-7, Math.round(SY(10.5))-1, 14, 2); }
    else { vctx.beginPath(); vctx.ellipse(x, Math.round(SY(w.y)), 4+8*f, 2+f, 0, 0, 6.283); vctx.fill(); }
    vctx.globalAlpha = 1;
  }
  const b = boss;
  if (b && !b.dead && !b.gone){
    if (b.kind === "sky" && b.y < 8.5){                     // uçan bossun yer gölgesi
      const hg = clamp((10.5-b.y)/8, 0, 1), rx = b.hw*TS*(1-0.45*hg);
      vctx.fillStyle = "rgba(0,0,0,"+(0.35-0.15*hg)+")"; vctx.beginPath(); vctx.ellipse(Math.round(SX(b.x)), Math.round(SY(10.5)), rx, 2.5, 0, 0, 6.283); vctx.fill();
    }
    if (b.state === "stun" || b.state === "tired" || b.tiredT > 0){   // "şimdi vur" oku
      const x = Math.round(SX(b.x)), y = Math.round(SY(b.y-b.hh))-10+Math.round(Math.sin(t*8)*2);
      vctx.fillStyle = "#ffe060"; vctx.beginPath(); vctx.moveTo(x-4,y-4); vctx.lineTo(x+4,y-4); vctx.lineTo(x,y+2); vctx.fill();
    }
  }
};
})();
</script>
<script>
/* =====================================================================
   OVERHAUL PACK  —  drop-in <script> block (paste LAST, right before </body>)
   1. Cinematic Rage Mode      (hitstop, zoom, shake, flash, title card, tint)
   2. Boss archetypes          (Bullet-hell / Charger / Trapper / Summoner + shield & vulnerability windows)
   3. Seasonal rules           (ice gusts+grip, rising lava / magma tides, low-g zones + gravity waves, darkness)
   4. Generators               (serpent maze, chimney wall-jump shaft, per-season architecture plan)
   Everything wraps existing globals the same way your boss add-on does; nothing in the original code is edited.
   Tuning knobs: window.OVERHAUL.CFG
   ===================================================================== */
(function(){
"use strict";
const R = Math.random, PI = Math.PI, TAU = PI*2;

const CFG = {
  // --- cinematic rage
  rageLabel:"RAGE MODE: ", hitstop:0.5, rageTime:2.7, zoom:1.55, rageSpeed:1.25, minisRage:true,
  // --- boss archetypes
  archetypes:true, bossHpMul:1.3, windowT:2.3, windowTrage:1.7, maxShots:200, shieldHits:true,
  // --- seasonal rules
  rules:true, iceGrip:0.5, lavaSpeed:0.42, darkness:true,
  // --- generators
  newArchitecture:true
};
const alive = b => b && !b.dead && !b.gone;
const ease = x => { x = clamp(x,0,1); return x*x*(3-2*x); };
const colOf = b => b.def.col;
const SXf = x => (x-cam.x)*TS + LW/2, SYf = y => (y-cam.y)*TS + LH/2;

/* ------------------------------------------------------------------ shared queues */
let Q = [], TG = [], ZN = [];                   // delayed calls, telegraphs, hazard zones
const CIN = { on:false, t:0, dur:0, hs:0, b:null, light:false };
const later = (t, fn) => Q.push({t, fn});
const tg = o => { o.m = o.t; TG.push(o); };
const bul = (x, y, vx, vy, g, life, col) => {
  if (shots.length > CFG.maxShots) return;
  shoot("fire", x, y, vx, vy, 0.3, 0.3, life || 5, col); shots[shots.length-1].g = g || 0;
};
const groundY = (x, fromRow) => { const r = miniGroundRow(x, Math.max(0, Math.floor(fromRow))); return r === null ? 10.5 : r-0.5; };
function rockAt(x, col, v0){ shoot("rock", clamp(x, 2, MW-3), cam.y-7, 0, v0 || 8, 0.35, 0.35, 6, col); }
function strike(x, w, col){ x = clamp(x, 2, MW-3); tg({k:"col", x, y:groundY(x, 0), t:w, c:col}); later(w, () => rockAt(x, col, 9)); SFX.alert(); }
function zone(x, w, life, col, kind, warn, h){
  if (ZN.length >= 7) ZN.shift();
  x = clamp(x, 2, MW-3);
  ZN.push({ x, w, y:groundY(x, player.y-1), h:h || 1.1, warn:warn || 1, life, m:life, c:col, k:kind || "fire", tick:0 });
}
function popup(b, s){ addPopup(s, b.x, b.y-b.hh-1.3, true); }

/* ====================================================================
   1. CINEMATIC RAGE MODE
   ==================================================================== */
const isRaging = b => CIN.on && CIN.b === b;
function cinW(){ if (!CIN.on) return 0; return ease(CIN.t/0.35) * ease((CIN.dur-CIN.t)/0.5); }
function curZoom(){ return 1 + (CFG.zoom-1) * cinW() * (CIN.light ? 0.55 : 1); }

function startRage(b){
  const light = !!b.mini;
  CIN.on = true; CIN.t = 0; CIN.b = b; CIN.light = light;
  CIN.hs = light ? 0.25 : CFG.hitstop; CIN.dur = light ? 1.5 : CFG.rageTime;
  b.rage = true; b.p2 = 1;                         // p2 = silences the old "ÖFKE MODU" popup
  b.tiredT = 0; b.vx = 0; b.q2 = null;
  if (b.arch){ b.state = "a_roam"; b.t = 0.7; b.nx = null; }
  shots.length = 0; Q.length = 0; TG.length = 0; ZN.length = 0;
  st.shake = 1.0; SFX.slam();
  beep(62, 1.3, "sawtooth", 0.14, -20); beep(98, 1.0, "square", 0.07, -45);
  setTimeout(() => beep(240, 0.5, "sawtooth", 0.06, -170), 380);
  burst(b.x, b.y, 36, [colOf(b), "#fff", "#ff3030"], 8, 0.9, 4, 3);
}
function endRage(){
  const b = CIN.b; CIN.on = false; CIN.b = null;
  if (!alive(b)) return;
  if (!b.mini) b.k *= CFG.rageSpeed;
  st.shake = Math.max(st.shake, 0.9); SFX.explode();
  const n = b.mini ? 8 : 16;
  for (let i = 0; i < n; i++){ const a = i/n*TAU; bul(b.x, b.y, Math.cos(a)*3.6*b.k, Math.sin(a)*3.6*b.k, 0, 5, colOf(b)); }
  if (b.kind === "golem") groundWaves(b, 8.5*b.k);
  const p = player; if (!p.dead && Math.abs(p.x-b.x) < 6){ p.vx = (p.x >= b.x ? 1 : -1)*8; p.vy = -7; p.stun = 0.15; }
  p.invul = Math.max(p.invul, 0.6); b.inv = 0;
  if (b.arch){ b.state = "a_roam"; b.t = 0.7; }
}

/* ====================================================================
   2. BOSS ARCHETYPES  (hell / charge / trap / summon)  +  SHIELD & WINDOWS
   ==================================================================== */
const ARCH_OF = { owl:"hell", crystal:"hell", sky:"hell",  eagle:"charge", yeti:"charge", scorp:"charge",
                  golem:"trap", dragon:"trap", storm:"trap",  mush:"summon", frog:"summon", wraith:"summon" };
const MINION = { mush:"E", frog:"J", wraith:"W" };
const ZKIND = { golem:"rock", dragon:"lava", storm:"shock" };

const _mb = makeBoss;
makeBoss = function(def, c, r, mini){
  const b = _mb(def, c, r, mini);
  if (!mini && CFG.archetypes){ b.arch = ARCH_OF[def.art] || "hell"; b.hp = b.maxHp = Math.round(b.maxHp*CFG.bossHpMul); b.tiredCd = 1e9; b.ai = 0; }
  return b;
};

// --- shield: the boss can only be hurt while tiredT > 0 (stun / cast / link-break windows)
const _hb = hitBoss;
hitBoss = function(b, n){
  if (CFG.shieldHits && b.arch && !b.dead && (!(b.tiredT > 0) || isRaging(b))){
    b.shield = 0.3;
    if (!(b.blockCd > 0)){ b.blockCd = 0.6; addPopup("KALKAN!", b.x, b.y-b.hh-0.6, false); SFX.alert(); }
    burst(player.x, player.y, 5, ["#9fe8ff", "#fff"], 3, 0.3, 4);
    return false;
  }
  const r = _hb(b, n);
  if (r && b.arch) b.inv = Math.min(b.inv, 0.45);
  return r;
};

// --- helpers for the state machine
const ownerAlive = b => enemies.filter(m => m.owner === b && !m.dead).length;
function openWindow(b, e){
  const d = e ? CFG.windowTrage : CFG.windowT;
  if (b.kind === "golem"){
    if (!b.grounded){ b.state = "a_roam"; b.t = 0.3; return; }
    b.tiredT = d; b.state = "a_open"; b.vx = 0;
  } else { b.state = "a_down"; b.wd = d; }
  popup(b, "ZAYIF NOKTA!");
}
function endAtk(b, e){
  const A = b.cur;
  if (A && A.win) openWindow(b, e);
  else { b.state = "a_roam"; b.t = (e ? 0.6 : 0.9); }
}
function startAtk(b, name, teleT, dur, fn, jump){
  b.state = "a_tele"; b.t = teleT; b.nx = { dur, fn, jump }; b.vx = 0; popup(b, name); SFX.alert();
}
function wallHit(b, e){
  st.shake = Math.max(st.shake, 0.9); SFX.slam();
  burst(b.x + b.dir*b.hw, b.y, 26, ["#fff", colOf(b), "#c8c0a8"], 6, 0.7, 10, 3);
  for (let i = 0; i < (e ? 4 : 3); i++) later(0.2 + i*0.25, () => strike(b.x - b.dir*(2 + i*3.2) + (R()-0.5)*2, 0.75, colOf(b)));
  b.vx = 0; b.tiredT = e ? 2.5 : 3.1; b.state = "a_open"; popup(b, "BAŞI DÖNDÜ!");
}
function spawnMinions(b, e){
  const art = b.def.art, mk0 = MINION[art], kinds = art === "wraith" ? ["W", "W", "V"] : [mk0, mk0, "V"];
  let made = 0;
  for (let i = 0; i < (e ? 3 : 2); i++){
    if (enemies.filter(m => !m.dead).length >= 4) break;
    const kind = kinds[i % kinds.length], fly = kind === "V" || kind === "W";
    const x = clamp(Math.round(b.x + (i % 2 ? 1 : -1)*(4 + R()*4)), 3, MW-4);
    let r = 6; if (!fly){ const gr = miniGroundRow(x, 8); if (gr === null) continue; r = gr-1; }
    const m = makeEnemy(x, r, kind); m.owner = b; enemies.push(m); made++;
    burst(x, r, 10, [colOf(b), "#fff"], 3, 0.5, 0);
  }
  return made;
}
function startCharge(b, e){
  b.dir = player.x >= b.x ? 1 : -1; b.nx = { charge:true, e }; b.state = "a_tele"; b.t = e ? 0.75 : 0.95; b.ly = null; popup(b, "ATILMA!"); SFX.alert();
  if (b.kind === "golem") tg({ k:"lane", x:b.x, x1:b.dir > 0 ? MW-2 : 1, y:b.y+b.hh-0.25, t:b.t, c:"#ff3a3a" });
  else b.side = player.x < MW/2 ? 1 : -1;       // air charger starts on the far wall
}

// ---- attack library ---------------------------------------------------------
const HELL = [
  { n:"SPİRAL", tele:0.7, win:true, fn(b, e){
      const arms = e ? 3 : 2, iv = e ? 0.07 : 0.09, N = Math.floor((e ? 4.2 : 3.4)/iv), dir = R() < 0.5 ? 1 : -1, sp = (e ? 4.4 : 3.8)*b.k, a0 = R()*TAU;
      b.t = N*iv + 0.25;
      for (let i = 0; i < N; i++) later(i*iv, () => { if (!alive(b) || b.state !== "a_atk") return;
        for (let k = 0; k < arms; k++){ const an = a0 + i*0.42*dir + k*TAU/arms; bul(b.x, b.y, Math.cos(an)*sp, Math.sin(an)*sp, 0, 7, colOf(b)); }
        if (i % 7 === 0) SFX.shoot(); }); } },
  { n:"KONİ SALVOSU", tele:0.8, win:true, fn(b, e){
      const V = e ? 7 : 5, gap = 0.5; b.t = V*gap + 0.35;
      for (let v = 0; v < V; v++) later(v*gap, () => { if (!alive(b) || b.state !== "a_atk") return;
        const base = Math.atan2(player.y-b.y, player.x-b.x) + Math.sin(v*1.3)*0.25, n = 9, hole = (v*3 + 2) % n;

// switch-back maze: stacked corridors, each connected by a zig-zag of ledges. Lane 0 has pits, upper lanes have drop-gaps.

  m.fill(2, W-3, fr(0), H-1);                                                                    // lane 0
  for (let k = 1; k < L; k++) if (k % 2 === 1) m.fill(2, HC-1, fr(k), fr(k)); else m.fill(mx(HC-1), W-3, fr(k), fr(k));   // upper lanes (hole over the connector below)
  for (let k = 0; k < L-1; k++){                                                                 // connectors: 3 ledges climbing back toward the lane above
    const right = k % 2 === 0, f = fr(k), led = (c0, c1, r) => right ? m.fill(c0, c1, r, r) : m.fill(mx(c1), mx(c0), r, r);

  }

    const conn = k < L-1, a = k === 0 ? 10 : (k % 2 === 1 ? (conn ? 22 : 8) : 22), b = conn ? W-21 : (k % 2 === 0 ? W-8 : W-21), f = fr(k), occ = new Set();
    lanes.push({ a, b, f }); const free = (c, w = 2) => { for (let i = -1; i <= w; i++) if (occ.has(c+i)) return false; return true; }, take = (c, w = 2) => { for (let i = 0; i < w; i++) occ.add(c+i); };
    const arrive = k === 0 ? 4 : (k % 2 === 1 ? HC-2 : mx(HC-1)+2); if (k > 0) m.put(arrive, f-1, "K");
    for (let i = 0; i < 3; i++) occ.add(arrive+i-1);

      else if (r < 0.80){ take(c, 1); const kk = pick(); pu(c, (kk === "V" || kk === "W") ? f-ri(3, 4) : f-1, kk); }
      else if (r < 0.88 && o.turret > 0.05){ take(c, 1); pu(c, f-1, "T"); }
      else m.line(c, f-2, 4, rnd() < 0.2 ? "s" : "b");
    }
    for (let c = a+2; c < b; c += 3) pu(c, f-2, rnd() < 0.15 ? "s" : "b");
    if (k % 2 === 1) pu(ri(a+4, b-4), f-1, "H"); if (k === 1) pu(ri(a+6, b-6), f-1, "I"); if (k % 2 === 0 && k > 0) pu(ri(a+6, b-6), f-1, "A");

  const nk = o.keys || 0; for (let k = 0; k < nk; k++){ const ln = lanes[Math.min(L-1, k % L)]; m.put(ri(ln.a+3, ln.b-3), ln.f-1, "Y"); }

<script>
/* ===== X5: kombo + game feel + yedek + sonsuz mod (PvP koduna dokunmaz) ===== */
(function(){
"use strict";
const now = () => performance.now();

// ---------- KOMBO

}

// ---------- HOOKS
const _ke = killEnemy;

};

};

killPlayer = function(){ X5.comboReset(); _kp(); if (X5.E.on) X5.E.over = true; };

const dist = (a, x, y) => Math.hypot(a.x-x, a.y-y);

    for (const c of coins){ const d = dist(c,p.x,p.y); if (d < R && d > 0.05){ const s = Math.min(d, 16*dt); c.x += (p.x-c.x)/d*s; c.y += (p.y-c.y)/d*s; } }
  }
};

// ---------- KAYIT YEDEĞİ

// ---------- SONSUZ MOD

      }

    const want = Math.min(4, 1 + (s/3 | 0) + (l > 6 ? 1 : 0)), picked = [];
    for (let i = runs.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [runs[i], runs[j]] = [runs[j], runs[i]]; }
    for (const ru of runs){
      if (picked.length >= want) break;
      if (picked.some(q => Math.abs(q.c0-ru.c0) < 7 && Math.abs(q.r-ru.r) < 4)) continue;
      picked.push(ru);
    }
    let kind = rnd() < 0.5 ? 0 : 1;
    picked.forEach((ru, g) => {
      for (let c = ru.c0; c <= ru.c1; c++){
        trapCells.add(c+","+ru.r);
        if (kind === 0) CR.push({c, r:ru.r, g, s:0, u:0}); else TM.push({c, r:ru.r, g, on:true});
      }
      kind ^= 1;
    });
  }

  const bad = [];
  for (const arr of [spikes, springs, turrets, cps, pows, keyItems, enemies, bosses]) for (const o of arr) bad.push([o.x, o.y]);
  if (finish) bad.push([finish.x, finish.y]);
  bad.push([player.x, player.y]);
  const cand = [];
  for (let r = 2; r < MH-1; r++) for (let c = 6; c < MW-6; c++){
    if (MAP[r][c] !== "." || MAP[r+1][c] !== "#" || trapCells.has(c+","+(r+1))) continue;
    let flat = true;
    for (let d = -2; d <= 2; d++) if (MAP[r][c+d] !== "." || MAP[r+1][c+d] !== "#" || trapCells.has((c+d)+","+(r+1))){ flat = false; break; }
    if (!flat) continue;
    for (let h = 1; h <= 3; h++) if (MAP[r-h] && MAP[r-h][c] === "#"){ flat = false; break; }
    if (!flat) continue;
    if (bad.some(q => Math.hypot(q[0]-c, q[1]-r) < 5)) continue;
    cand.push([c, r]);
  }
  for (let i = cand.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [cand[i], cand[j]] = [cand[j], cand[i]]; }
  const nj = s === 0 ? 1 : Math.min(5, 1 + (s >> 1) + (l >> 2));
  for (const [c, r] of cand){
    if (FJ.length >= nj) break;
    if (FJ.some(j => Math.hypot(j.c-c, j.r-r) < 10)) continue;
    FJ.push({c, r, off:FJ.length*0.9 + rnd()*1.5, m:0, h:0});
  }
}

const _ll = loadLevel;
loadLevel = function(i, o){ _ll(i, o); try{ build(); }catch(e){ CR = []; TM = []; FJ = []; } };

const _step = step;
step = function(dt){
  _step(dt);
  if (!ok()) return;
  const p = player, t = st.time;
  for (const b of CR){
    if (b.s === 0){
      if (!p.dead && p.grounded && Math.abs(p.x-b.c) < 0.5 + p.hw*0.6 && Math.abs(p.y+p.hh-(b.r-0.5)) < 0.15){
        for (const o of CR) if (o.g === b.g && o.s === 0){ o.s = 1; o.u = t + 0.45 + 0.09*Math.abs(o.c-b.c); }
        SFX.alert();
      }
    } else if (b.s === 1){
      if (t >= b.u){ setT(b.c, b.r, "."); b.s = 2; b.u = t + 3.6; burst(b.c, b.r, 12, ["#c08040", "#7a4a20", "#fff"], 4, 0.5, 12); SFX.stomp(); }
      else if (R() < dt*20) burst(b.c + (R()-0.5), b.r + 0.5, 1, ["#c08040"], 1, 0.4, 6, 1);
    } else if (b.s === 2 && t >= b.u){
      if (blocked(b)) b.u = t + 0.3;
      else { setT(b.c, b.r, "#"); b.s = 0; burst(b.c, b.r, 6, ["#fff", "#c08040"], 2, 0.3, 0); }
    }
  }
  for (const b of TM){
    const want = ((t + b.g*1.3) % 4.7) < 3.0;
    if (want && !b.on){ if (blocked(b)) continue; setT(b.c, b.r, "#"); b.on = true; }
    else if (!want && b.on){ setT(b.c, b.r, "."); b.on = false; burst(b.c, b.r, 5, ["#7cc8ff", "#fff"], 2, 0.3, 0, 1); }
  }
  for (const j of FJ){
    const ph = (t + j.off) % 3.4; let m = 0, h = 0;
    if (ph >= 1.5 && ph < 2.2) m = 1;
    else if (ph >= 2.2 && ph < 3.1){ m = 2; const k = ph - 2.2; h = 2.7*Math.min(1, k/0.12)*(k > 0.75 ? Math.max(0, 1-(k-0.75)/0.15) : 1); }
    if (m === 2 && j.m !== 2 && inView(j.c, j.r, 6)) noise(0.5, 0.06, 900, 200, 1, "lowpass");
    j.m = m; j.h = h;
    if (!inView(j.c, j.r, 3)) continue;
    if (m === 1 && R() < dt*30) burst(j.c + (R()-0.5)*0.3, j.r + 0.35, 1, ["#ffb030", "#ff5a20"], 1.2, 0.3, -2, 1);
    if (m === 2){
      if (R() < dt*50) burst(j.c + (R()-0.5)*0.4, j.r + 0.5 - h*R(), 1, ["#ffb030", "#ff5a20", "#fff3a0"], 1.5, 0.5, -4, 1);
      if (!p.dead && Math.abs(p.x-j.c) < 0.3 + p.hw && p.y + p.hh > j.r + 0.5 - h && p.y - p.hh < j.r + 0.5) damagePlayer(j.c);
    }
  }
};

function draw(){
  if (!st || !player || (window.OVERHAUL && OVERHAUL.CIN && OVERHAUL.CIN.on)) return;
  if (!CR.length && !TM.length && !FJ.length) return;
  const t = st.time, tt = performance.now()/1000, z = camZ < 0.995;
  if (z){ vctx.save(); vctx.translate(LW/2, LH/2); vctx.scale(camZ, camZ); vctx.translate(-LW/2, -LH/2); }
  for (const b of CR){
    if (!inView(b.c, b.r, 2)) continue;
    const x = Math.round(sXf(b.c-0.5)), y = Math.round(sYf(b.r-0.5));
    if (b.s === 0 || b.s === 1){
      if (b.s === 1){ const jx = Math.round((Math.random()-0.5)*2); vctx.fillStyle = "rgba(255,120,40,"+(0.25+0.3*Math.abs(Math.sin(tt*30))).toFixed(2)+")"; vctx.fillRect(x+jx, y, 16, 16); }
      vctx.fillStyle = "rgba(255,170,60,0.4)"; vctx.fillRect(x, y, 16, 2);
      vctx.fillStyle = "rgba(60,30,10,0.55)"; vctx.fillRect(x+3, y+4, 1, 4); vctx.fillRect(x+4, y+7, 4, 1); vctx.fillRect(x+10, y+3, 1, 6); vctx.fillRect(x+7, y+11, 4, 1);
    } else {
      const soon = b.u - t < 1.2, a = soon ? (Math.floor(tt*10) % 2 ? 0.7 : 0.15) : 0.15;
      vctx.strokeStyle = "rgba(255,170,60,"+a+")"; vctx.lineWidth = 1; vctx.strokeRect(x+0.5, y+0.5, 15, 15);
    }
  }
  for (const b of TM){
    if (!inView(b.c, b.r, 2)) continue;
    const ph = (t + b.g*1.3) % 4.7, x = Math.round(sXf(b.c-0.5)), y = Math.round(sYf(b.r-0.5));
    if (b.on){
      const flick = ph >= 2.4 && Math.floor(tt*14) % 2;
      vctx.fillStyle = flick ? "rgba(255,60,60,0.5)" : "rgba(90,200,255,0.3)"; vctx.fillRect(x, y, 16, 16);
      vctx.fillStyle = "rgba(220,245,255,0.8)"; vctx.fillRect(x, y, 16, 1); vctx.fillRect(x+2, y+7, 2, 2); vctx.fillRect(x+12, y+7, 2, 2);
    } else {
      const soon = ph >= 4.2, a = soon ? (Math.floor(tt*12) % 2 ? 0.75 : 0.2) : 0.25;
      vctx.strokeStyle = "rgba(120,210,255,"+a+")"; vctx.lineWidth = 1; vctx.setLineDash([2, 2]); vctx.strokeRect(x+0.5, y+0.5, 15, 15); vctx.setLineDash([]);
    }
  }
  for (const j of FJ){
    if (!inView(j.c, j.r, 3)) continue;
    const cx = Math.round(sXf(j.c)), yf = Math.round(sYf(j.r+0.5));
    vctx.fillStyle = "#3a3a48"; vctx.fillRect(cx-5, yf-3, 10, 3); vctx.fillStyle = "#6a6a80"; vctx.fillRect(cx-4, yf-4, 8, 1);
    vctx.fillStyle = j.m === 2 ? "#ffd040" : j.m === 1 ? (Math.floor(tt*16) % 2 ? "#ffd040" : "#ff5a20") : "#5a2a1a"; vctx.fillRect(cx-1, yf-4, 2, 1);
    if (j.m === 1){ vctx.fillStyle = Math.floor(tt*16) % 2 ? "#ffb030" : "#ff5a20"; vctx.fillRect(cx-1, yf-7-Math.floor(Math.random()*3), 2, 3); }
    if (j.m === 2 && j.h > 0.05){
      const px = j.h*TS;
      for (let yy = 0; yy < px; yy += 2){
        const f = yy/px, w = (1-f*0.55)*(9 + Math.sin(tt*40+yy*0.6)*1.5), yy0 = Math.round(yf-5-yy);
        vctx.globalAlpha = 1-f*0.35;
        vctx.fillStyle = "#ff5a20"; vctx.fillRect(Math.round(cx-w/2), yy0, Math.round(w), 2);
        vctx.fillStyle = "#ffb030"; vctx.fillRect(Math.round(cx-w*0.31), yy0, Math.round(w*0.62), 2);
        vctx.fillStyle = "#fff3a0"; vctx.fillRect(Math.round(cx-w*0.14), yy0, Math.max(1, Math.round(w*0.28)), 2);
      }
      vctx.globalAlpha = 1;
      const g = vctx.createRadialGradient(cx, yf-px/2, 2, cx, yf-px/2, px*0.8 + 6);
      g.addColorStop(0, "rgba(255,150,40,0.35)"); g.addColorStop(1, "rgba(255,100,20,0)");
      vctx.save(); vctx.globalCompositeOperation = "lighter"; vctx.fillStyle = g; vctx.fillRect(cx-px-8, yf-px*1.4-8, px*2+16, px*1.8+16); vctx.restore();
    }
  }
  if (z) vctx.restore();
}

/* --- kule patlama animasyonu --- */
const EX = [];
if (typeof hitTurret === "function"){
  const _ht = hitTurret;
  hitTurret = function(t, n){
    const had = turrets.indexOf(t) >= 0; _ht(t, n);
    if (had && turrets.indexOf(t) < 0){
      EX.push({x:t.x, y:t.y, t:performance.now(), sp:Array.from({length:14}, (_, i) => ({a:i/14*6.283 + Math.random()*0.4, v:2 + Math.random()*3.5}))});
      try{ SFX.explode(); }catch(e){}
      burst(t.x, t.y, 24, ["#ffd040", "#ff6a20", "#444", "#fff"], 8, 0.9, 6, 3);
      st.shake = Math.max(st.shake, 0.35);
    }
  };
}
function drawEX(){
  if (!EX.length || !st || (window.OVERHAUL && OVERHAUL.CIN && OVERHAUL.CIN.on)) return;
  const now = performance.now(), z = camZ < 0.995;
  if (z){ vctx.save(); vctx.translate(LW/2, LH/2); vctx.scale(camZ, camZ); vctx.translate(-LW/2, -LH/2); }
  for (let i = EX.length-1; i >= 0; i--){
    const e = EX[i], k = (now-e.t)/700;
    if (k >= 1){ EX.splice(i, 1); continue; }
    const cx = sXf(e.x), cy = sYf(e.y), r = 4 + k*22;
    if (k < 0.2){ vctx.fillStyle = "rgba(255,255,255,"+(1-k/0.2)+")"; vctx.beginPath(); vctx.arc(cx, cy, 6+k*60, 0, 6.283); vctx.fill(); }
    vctx.globalAlpha = 1-k;
    vctx.fillStyle = "#ff6a20"; vctx.beginPath(); vctx.arc(cx, cy, r, 0, 6.283); vctx.fill();
    vctx.fillStyle = "#ffb030"; vctx.beginPath(); vctx.arc(cx, cy, r*0.7, 0, 6.283); vctx.fill();
    vctx.fillStyle = "#fff3a0"; vctx.beginPath(); vctx.arc(cx, cy, r*0.38, 0, 6.283); vctx.fill();
    vctx.strokeStyle = "#ffd040"; vctx.lineWidth = 2*(1-k); vctx.beginPath(); vctx.arc(cx, cy, r*1.5, 0, 6.283); vctx.stroke();
    vctx.fillStyle = "#ffd040";
    for (const q of e.sp) vctx.fillRect(Math.round(cx + Math.cos(q.a)*q.v*k*16), Math.round(cy + Math.sin(q.a)*q.v*k*16 + k*k*14), 2, 2);
    vctx.globalAlpha = 0.5*(1-k); vctx.fillStyle = "#333";
    vctx.beginPath(); vctx.arc(cx, cy - k*16, 5 + k*10, 0, 6.283); vctx.fill();
    vctx.globalAlpha = 1;
  }
  if (z) vctx.restore();
}
const _rw = renderWorld;
renderWorld = function(){ _rw(); try{ draw(); drawEX(); }catch(e){} };
})();
</script>

(function(){const O=document.createElement("div");O.style.cssText="position:fixed;inset:0;z-index:100002;display:none;align-items:center;justify-content:center;text-align:center;background:#070918f0;color:#fff;font:bold 20px sans-serif;padding:24px";O.innerHTML="📱 Telefonu yatay çevir";document.body.appendChild(O);

<script>
(function(){
"use strict";
/* ===== OYNANIŞ PAKETİ v16: ölüm özeti, Zor'da kontrol noktası hakkı, İmkansız süre dengesi, boss çeşitliliği, Özel Bölümler kısayolu ===== */
const G = { cur:null, curT:0, cause:null, ct:0, hist:[], last:null, pend:null, used:{}, rp:null, rp2:null };
const now = () => performance.now();
const EN = { E:"Yürüyen canavar", J:"Zıplayan canavar", V:"Yarasa", C:"Boğa", Z:"Dikenli canavar", W:"Hayalet" };
const SH = { bolt:["Kule ateşi","Kuleye yaklaşmadan zıpla, dondur ya da balta ile vur"], fire:["Ateş topu","Mermiyi görünce zıpla ya da dash at"], wave:["Şok dalgası","Dalganın üstünden zıpla"], rock:["Düşen kaya","Kırmızı uyarı çizgisinden uzaklaş"] };
const parMult = () => LV.dir !== "right" ? 1.55 : 1.3;      // İmkansız: kule/kuyu/labirent bölümlerine daha cömert süre
const guess = () => {
  const p = player; let best = null, bd = 99;
  const c = (n, tip, d) => { if (d < bd){ bd = d; best = [n, tip]; } };
  for (const s of shots){ const d = Math.hypot(s.x-p.x, s.y-p.y)-s.rw; if (d < 1.5){ const m = SH[s.kind] || ["Mermi", "Zıpla ya da dash at"]; c(m[0], m[1], d); } }
  for (const s of spikes){ const d = Math.hypot(s.x-p.x, s.y-p.y)-0.5; if (d < 1.3) c("Diken", "Dikenlerin üstünden zıpla ya da dash at (dash sırasında hasar almazsın)", d); }
  for (const e of enemies){ if (e.dead) continue; const d = Math.hypot(e.x-p.x, e.y-p.y)-0.4; if (d < 1.5) c(EN[e.kind] || "Canavar", "Üstüne zıpla, dash at ya da balta fırlat", d); }
  for (const t of turrets){ const d = Math.hypot(t.x-p.x, t.y-p.y)-0.4; if (d < 1.3) c("Top kulesi", "Kuleye yukarıdan zıpla ya da balta ile yık", d); }
  for (const b of bosses){ if (b.dead || b.gone || b.sleep) continue; const d = Math.hypot(b.x-p.x, b.y-p.y)-b.hw; if (d < 1.8) c(b.name, "Gövdeye değme; ZAYIF NOKTA açılınca üstüne zıpla", d); }
  return best || ["Tuzak / ortam tehlikesi", "Zemindeki uyarı işaretlerine ve zamanlamaya dikkat et"];
};

// ---- hasar nedenini kaydet
const _dp = damagePlayer;
damagePlayer = function(srcX){
  const p = player;
  if (!p || p.dead || p.invul > 0 || p.dash > 0 || p.star > 0 || st.state !== "play") return _dp(srcX);
  const g = guess(), h = st.hp; G.cur = g; G.curT = now();
  _dp(srcX);
  if (st.hp < h){ G.cause = g; G.ct = now(); G.hist.push(g[0]); if (G.hist.length > 4) G.hist.shift(); }
};
const _kp = killPlayer;
killPlayer = function(){
  if (player && !player.dead && st.state === "play"){
    const p = player; let r;
    if (p.y >= KILLY-0.05) r = ["Boşluğa düştün", "Çift zıpla; kancayı ve hareketli platformları kullan"];
    else if (D().imp && st.time > (LV.boss ? 250 : LV.par*parMult())-0.6) r = ["Süre doldu", "İmkansız modda süre sınırı var: görevlere odaklan, gereksiz dövüşü atla"];
    else if (now()-G.curT < 120) r = G.cur;
    else if (now()-G.ct < 2500) r = G.cause;
    else r = ["Bilinmiyor", ""];
    G.last = { name:r[0], tip:r[1], lvl:st.lvl, hist:G.hist.slice() };
    G.pend = (diff === 2 && st.cp) ? { lvl:st.lvl, cp:st.cp } : null;
  }
  _kp();
};

// ---- ZOR: bölüm başına 1 kontrol noktası hakkı (ikinci ölümde bölüm baştan)
const canCp = () => diff === 2 && st && st.state === "over" && st.cp && (G.used[st.lvl] || 0) < 1;
const _ll = loadLevel;
loadLevel = function(i, o){
  o = o || {}; const pend = G.pend; G.pend = null; let used = false;
  if (diff === 2 && !o.cp && pend && pend.lvl === i && st && st.state === "over" && (pressed.Enter || pressed.Space) && (G.used[i] || 0) < 1){
    G.used[i] = 1; o = Object.assign({}, o, { cp:pend.cp }); used = true;
  } else G.used[i] = 0;
  G.hist = [];
  _ll(i, o);
  if (used) say("Zor: kontrol noktası hakkı kullanıldı (bölüm başına 1)");
};

// ---- İMKANSIZ: süre sınırı bölüm tipine göre; boss süresi 150 -> ~250 sn
const _step = step;
step = function(dt){
  const imp = D().imp && st && st.state === "play" && !st.paused && LV;
  if (imp && !LV.boss){ G.rp = LV.par; LV.par = G.rp*parMult()/1.15; }
  else if (imp && LV.boss) st.time -= dt*0.4;
  try{ _step(dt); } finally { if (G.rp !== null){ LV.par = G.rp; G.rp = null; } }
};
const _wg = winGame;
winGame = function(){ if (G.rp !== null) LV.par = G.rp; return _wg.apply(this, arguments); };

// ---- BOSS: saldırı sırası rastgele ilerler (aynı döngü ezberlenmesin)
const _ub = updateBoss;
updateBoss = function(b, dt){
  if (b && b.arch && !b.dead && !b.gone && !b.sleep){
    if (b.state === "a_roam"){ if (!b._rr && b.t <= dt*1.6){ b.ai = (b.ai || 0)+Math.floor(Math.random()*3); b._rr = 1; } }
    else b._rr = 0;
  }
  return _ub.call(this, b, dt);
};

// ---- çizim: ölüm özeti + İmkansız HUD süresi
const _r = render;
render = function(){
  const sw = D().imp && st && LV && !LV.boss && st.state !== "title";
  if (sw){ G.rp2 = LV.par; LV.par = G.rp2*parMult()/1.15; }
  try{ _r(); } finally { if (G.rp2 !== null){ LV.par = G.rp2; G.rp2 = null; } }
  try{
    if (!st || st.state !== "over" || !G.last || G.last.lvl !== st.lvl || (window.X5 && X5.E && X5.E.on)) return;
    const W = canvas.width, H = canvas.height; let sc = Math.min(W/LW, H/LH); if (sc > 1) sc = Math.max(1, Math.floor(sc*4)/4);
    const u = sc*LH/540, ox = Math.round((W-LW*sc)/2), oy = Math.round((H-LH*sc)/2), cx = ox+LW*sc/2; let y = oy+LH*sc*0.28+196*u;
    text("☠ Ölüm nedeni: "+G.last.name, cx, y, 22*u, "#ff8a8a", "center"); y += 30*u;
    if (G.last.tip){ text("İpucu: "+G.last.tip, cx, y, 15*u, "#cfe6ff", "center"); y += 24*u; }
    if (G.last.hist.length > 1){ text("Son hasarlar: "+G.last.hist.join(" → "), cx, y, 13*u, "#9fb0d0", "center"); y += 22*u; }
    if (canCp()) text("ZOR: 1 kontrol noktası hakkın var — Enter ile kontrol noktasından devam", cx, y, 16*u, "#73ff8c", "center");
    else if (diff === 2 && st.cp) text("ZOR: kontrol noktası hakkı bitti — bölüm baştan başlar", cx, y, 16*u, "#ffb870", "center");
  }catch(e){}
};

// ---- ana menüde "Özel Bölümler" kısayolu
const css = document.createElement("style");
css.textContent = "#spcbtn{position:fixed;top:calc(5% + 78px);right:4%;z-index:9000;display:none;padding:10px 16px;border-radius:14px;border:2px solid #c07aff;background:linear-gradient(#3a1f5a,#241440);color:#fff;font:bold 15px 'Trebuchet MS',sans-serif;cursor:pointer;box-shadow:0 0 14px #c07aff55}#spcbtn small{display:block;font:12px sans-serif;opacity:.8;margin-top:2px}#spcbtn:hover{filter:brightness(1.2)}";
document.head.appendChild(css);
const sb = document.createElement("div"); sb.id = "spcbtn"; sb.tabIndex = 0; sb.setAttribute("role", "button");
sb.innerHTML = '🎁 Özel Bölümler<small>Eğitim • Bonus • Gizli bölüm</small>';
const openSpc = () => { window.__hubTab = 0; for (const b of document.body.children) if (b.tagName === "BUTTON" && b.textContent.includes("Ayarlar")){ b.click(); return; } };
sb.onclick = openSpc; sb.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); openSpc(); } };
document.body.appendChild(sb);
const busy = () => lvlOpen || shopOpen || window.hudEdit || [...document.querySelectorAll(".ovl,#kbp,#petp,#pv,#slx,#tutask")].some(e => getComputedStyle(e).display !== "none");
setInterval(() => { sb.style.display = "none"; }, 250);
})();
</script>
<script>
/* =====================================================================
   SEZON DÜĞÜM HARİTASI (Season Node Map)
