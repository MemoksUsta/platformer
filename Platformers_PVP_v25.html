  ctx.fillStyle = "rgba(255,255,255,.15)"; rr(28,67,DW-56,6,3); ctx.fill();
  if (st2.comp){ ctx.fillStyle = acc; rr(28,67,(DW-56)*st2.comp/12,6,3); ctx.fill(); }
  if (NM.debug) T("DEBUG: kilitler açık", 130, 33, 12, "#ff6a6a", "left");
}
function chip(label,x,y,col){
  ctx.font = "bold 13px 'Trebuchet MS',Verdana,sans-serif"; const w = ctx.measureText(label).width+20;
  rr(x,y-11,w,22,11); ctx.fillStyle = "rgba(255,255,255,.1)"; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.stroke();
  T(label, x+10, y+1, 13, col, "left"); return w+8;
}
function objChips(sp,L){
  const a = [];
  if (sp.coins) a.push("🪙 Altın %"+Math.round(sp.coins*100));
  if (sp.kills) a.push("👾 "+sp.kills+" canavar");
  if (sp.keys)  a.push("🗝 "+sp.keys+" anahtar");
  if (sp.mini)  a.push("⚔ MİNİ "+L.bdef.name);
  if (sp.boss)  a.push("👹 "+L.bdef.name);
  return a;
}
function drawCard(tg,acc,accL,un,md,now){
  const x0 = 20, y0 = 398, w = DW-40, h = 130, ax = x0+28, bx = x0+540;
  rr(x0,y0,w,h,16); { const cg = ctx.createLinearGradient(0,y0,0,y0+h); cg.addColorStop(0,"rgba(22,28,68,.94)"); cg.addColorStop(1,"rgba(6,8,28,.92)"); ctx.fillStyle = cg; } ctx.fill(); ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = acc; rr(x0,y0+12,6,h-24,3); ctx.fill();
  let lock = false, play = "▶  OYNA";
  if (tg.t === "node"){
    const f = nodeInfo(lvlSeason,tg.i,un,md), L = f.L, sp = L.spec || {}, boss = !!L.boss, mini = !!sp.mini; lock = f.lock;
    T("SEZON "+(lvlSeason+1)+"  •  BÖLÜM "+(tg.i+1)+" / 12"+(boss ? "  •  SEZON BOSSU" : mini ? "  •  MİNİ BOSS" : ""), ax, y0+20, 13, accL, "left");
    T(L.name, ax, y0+46, 28, boss ? "#ff8a7a" : "#fff", "left");
    glyph(kindOf(L), ax+8, y0+75, 7, accL); T((L.sn || "—")+(L.envN ? "   •   "+L.envN : ""), ax+26, y0+75, 15, "#cfe6ff", "left");
    let cx = ax; for (const c of objChips(sp,L)){ cx += chip(c, cx, y0+104, "#ffb870"); if (cx > 520) break; }
    for (let k = 0; k < 3; k++) T("★", bx+14+k*32, y0+32, 30, k < f.stars && !f.lock ? "#ffd940" : "#3b4468", "center");
    T("En iyi puan: "+(lb[f.g] !== undefined ? lb[f.g] : "—"), bx, y0+64, 15, "#fff", "left");
    T("Süre hedefi (★): "+fmt(L.par), bx, y0+86, 14, "#aebbd8", "left");
    const stx = f.lock ? "🔒 Kilitli — "+(tg.i === 0 ? "önceki sezonu bitir" : "önceki bölümü bitir") : f.comp ? "✔ Tamamlandı" : f.cur ? "▶ Sıradaki bölüm" : "Açık";
    T(stx, bx, y0+108, 15, f.lock ? "#ff8a8a" : f.comp ? "#73ff8c" : "#ffd940", "left");
  } else {
    const b = BR[tg.k], ok = b.ok(); lock = !ok && !NM.debug;
    T(b.secret ? "GİZLİ BÖLÜM" : b.id === "tut" ? "EĞİTİM" : "BONUS BÖLÜM", ax, y0+20, 13, b.col, "left");
    T(lock && b.secret ? "🔒 ???" : b.name, ax, y0+46, 28, "#fff", "left");
    T(lock && b.secret ? "Bir şeyler saklanıyor…" : b.desc, ax, y0+76, 15, "#cfe6ff", "left");
    if (b.req) chip((lock ? "🔒 " : "✔ ")+reqTxt(b), ax, y0+104, lock ? "#ff8a8a" : "#73ff8c");
    T("Ödül: altın + XP", bx, y0+64, 15, "#ffd940", "left");
    T(lock ? "🔒 Kilitli" : "Her zaman tekrar oynanabilir", bx, y0+98, 15, lock ? "#ff8a8a" : "#73ff8c", "left");
  }
  const bw = 170, bh = 54, bX = x0+w-16-bw, bY = y0+22, hv = NM.hov && NM.hov.t === "play";
  ctx.save(); if (!lock){ ctx.shadowColor = acc; ctx.shadowBlur = 12*NM.geo.u; }
  rr(bX,bY,bw,bh,14); ctx.fillStyle = lock ? "#4a3a48" : hv ? mixc(acc,"#ffffff",0.3) : acc; ctx.fill(); ctx.restore();
  T(lock ? "🔒 KİLİTLİ" : play, bX+bw/2, bY+bh/2+1, 22, lock ? "#ffb0b0" : "#14141e", "center");
  T("Enter / Boşluk", bX+bw/2, bY+bh+16, 11, "#8d95b8", "center");
  NM.hit.push({ t:"play", x:bX, y:bY, w:bw, h:bh });
  T("←→ ilerle  •  ↑↓ dal / geri  •  Q/E sezon  •  Esc kapat", x0+w-16, y0+h-12, 11, "#6f7a9e", "right");
}

/* ------------------------------------------------------------------ ANA ÇİZİM (drawLevels yerine geçer) */
drawLevels = function(X,Y,VW,VH,u,cx){
  const now = performance.now(); let dt = (now-NM.last)/1000; NM.last = now; dt = Math.min(0.05, Math.max(0, dt));
  lvlSeason = clamp(lvlSeason|0, 0, 11); lvlStage = 1; LR.length = 0; LR.back = null;       // eski ızgara hit-test'i devre dışı
  if (NM.foc < 0 || NM.foc > 11) NM.foc = 0;
  const un = unlocked(), md = meta().done || {}, S = SEASONS[lvlSeason], acc = S.b.col, accL = mixc(acc,"#ffffff",0.35), Ls = layout(lvlSeason);

  // hover: önceki karenin hit listesine göre (yalnızca fare kullanılırken)
  const g0 = NM.geo; let hv = null;
  if (!NM.useKb && NM.mx >= 0) hv = hitAt((NM.mx-g0.X)/g0.u, (NM.my-g0.Y)/g0.u);
  NM.hov = hv; canvas.style.cursor = hv ? "pointer" : "default";
  NM.geo = { X, Y, u }; NM.hit.length = 0;

  // kahraman işaretçisi yumuşak hareket
  const tm = NM.br >= 0 ? BR[NM.br].a : NM.foc;
  NM.m += (tm-NM.m)*Math.min(1, dt*10); if (Math.abs(tm-NM.m) < 0.002) NM.m = tm;
  NM.bb += ((NM.br >= 0 ? 1 : 0)-NM.bb)*Math.min(1, dt*10); if (NM.br >= 0) NM.bi = NM.br;

  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.shadowBlur = 0; ctx.setLineDash([]); ctx.imageSmoothingEnabled = true;
  ctx.translate(X,Y); ctx.scale(u,u); ctx.beginPath(); ctx.rect(0,0,DW,DH); ctx.clip();

  drawBg(S, lvlSeason, now);
  const infos = []; for (let i = 0; i < 12; i++) infos.push(nodeInfo(lvlSeason,i,un,md));

  // --- yol parçaları (Bézier): tamamlanan = parlak, kilitli = kesik çizgi
  ctx.lineCap = "round";
  for (let i = 0; i < 11; i++){
    const sg = Ls.seg[i], open = !infos[i+1].lock;
    ctx.beginPath(); ctx.moveTo(sg.p0.x,sg.p0.y); ctx.bezierCurveTo(sg.c1.x,sg.c1.y,sg.c2.x,sg.c2.y,sg.p1.x,sg.p1.y);
    if (open){
      ctx.setLineDash([]); ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.lineWidth = 13; ctx.stroke();
      ctx.save(); ctx.shadowColor = acc; ctx.shadowBlur = 10*u; ctx.strokeStyle = accL; ctx.lineWidth = 7; ctx.stroke(); ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.setLineDash([2,13]); ctx.lineDashOffset = -now/45; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
      if (infos[i+1].cur){ ctx.fillStyle = "#fff"; for (let k = 0; k < 3; k++){ const q = bz(sg, ((now/1100)+k/3) % 1); ctx.beginPath(); ctx.arc(q.x,q.y,3,0,TAU); ctx.fill(); } }
    } else {
      ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth = 10; ctx.setLineDash([]); ctx.stroke();
      ctx.setLineDash([9,9]); ctx.strokeStyle = "rgba(150,160,200,.7)"; ctx.lineWidth = 4; ctx.stroke(); ctx.setLineDash([]);
    }
  }
  // --- yan dallar (bonus / gizli / eğitim)
  brList(lvlSeason).forEach(b => {
    const k = BR.indexOf(b), p = Ls.pts[b.a], bp = brPos(b), open = b.ok() || NM.debug;
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.quadraticCurveTo((p.x+bp.x)/2+(b.a === 0 ? -16 : 16), (p.y+bp.y)/2, bp.x, bp.y);
    ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.lineWidth = 9; ctx.setLineDash([]); ctx.stroke();
    if (open){ ctx.strokeStyle = b.col; ctx.lineWidth = 4; ctx.stroke(); } else { ctx.setLineDash([7,7]); ctx.strokeStyle = "rgba(150,160,200,.65)"; ctx.lineWidth = 3; ctx.stroke(); ctx.setLineDash([]); }
    drawBranch(k, b, bp, now, u);
  });
  for (let i = 0; i < 12; i++) drawNode(i, infos[i], Ls.pts[i], acc, now, u);

  // --- kahraman işaretçisi
  { const a = pathPos(lvlSeason, NM.m); let hx = a.x, hy = a.y;
    if (NM.bb > 0.01 && BR[NM.bi] && BR[NM.bi].s === lvlSeason){ const bp = brPos(BR[NM.bi]); hx += (bp.x-hx)*NM.bb; hy += (bp.y-hy)*NM.bb; }
    drawHero(hx, hy, now); }

  drawHeader(S, lvlSeason, acc, accL, un, md);
  let tg = NM.br >= 0 ? { t:"br", k:NM.br } : { t:"node", i:NM.foc };
  if (NM.hov && (NM.hov.t === "node" || NM.hov.t === "br")) tg = NM.hov;
  drawCard(tg, acc, accL, un, md, now);

  if (now < NM.toastT){                                    // geçici mesaj
    ctx.font = "bold 16px 'Trebuchet MS',Verdana,sans-serif"; const w = ctx.measureText(NM.toast).width+36;
    rr(DW/2-w/2,90,w,30,15); ctx.fillStyle = "rgba(60,12,24,.92)"; ctx.fill(); ctx.strokeStyle = "#ff6a7a"; ctx.lineWidth = 2; ctx.stroke(); T(NM.toast, DW/2, 106, 16, "#ffd0d0", "center");
  }
  ctx.strokeStyle = acc; ctx.globalAlpha = 0.85; ctx.lineWidth = 4; rr(4,4,DW-8,DH-8,18); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
};

/* ------------------------------------------------------------------ HIT-TEST */
function hitAt(dx,dy){
  for (let i = NM.hit.length-1; i >= 0; i--){ const h = NM.hit[i];
    if (h.r !== undefined){ if (Math.hypot(dx-h.x, dy-h.y) <= h.r) return h; }
    else if (dx >= h.x && dx <= h.x+h.w && dy >= h.y && dy <= h.y+h.h) return h; }
  return null;
}

/* ------------------------------------------------------------------ EYLEMLER */
function deny(msg,key){ NM.toast = msg; NM.toastT = performance.now()+1900; NM.shk = { k:key, t:performance.now() }; snd("alert"); }
function syncSel(){ const g = lvlSeason*12+NM.foc; if (g < unlocked()) sel = g; }       // başlık ekranı için global seçim
function setSeason(s,i){ lvlSeason = s; NM.foc = i; NM.br = -1; NM.m = i; NM.bb = 0; NM.shk = null; syncSel(); }
function seasonStep(d){ const ns = (lvlSeason+d+12) % 12; setSeason(ns, clamp(unlocked()-1-ns*12, 0, 11)); snd("click"); }
function focusNode(i){ NM.br = -1; NM.foc = i; syncSel(); snd("click"); }
function closeMap(){ lvlOpen = false; lvlStage = 0; NM.hov = null; canvas.style.cursor = ""; snd("click"); toTitle(); }
function startBranch(b){
  if (!window.EXT) return;
  if (!b.ok() && !NM.debug){ deny("🔒 "+(reqTxt(b) || "Kilitli"), "b"+BR.indexOf(b)); return; }
  initAudio(); lvlOpen = false; lvlStage = 0; NM.hov = null; canvas.style.cursor = "";
  try{ EXT.startCustom(b.make()); }catch(e){ lvlOpen = true; deny("Bölüm açılamadı", "b"+BR.indexOf(b)); }
}
function startFocused(){
  if (NM.br >= 0) return startBranch(BR[NM.br]);
  const g = lvlSeason*12+NM.foc;
  if (g >= unlocked() && !NM.debug){ deny("🔒 "+(NM.foc === 0 ? "Önce önceki sezonu bitir" : "Önce önceki bölümü bitir"), "n"+NM.foc); return; }
  initAudio(); sel = g; lvlOpen = false; lvlStage = 0; NM.hov = null; canvas.style.cursor = "";
  run = newRun(); loadLevel(g, { score:0 }); updateCamera(1, true);
}
function nav(dx,dy){
  NM.useKb = true;
  if (NM.br >= 0){ NM.foc = BR[NM.br].a; NM.br = -1; syncSel(); snd("click"); return; }          // daldan yola dön
  let step = dx;
  if (dy){
    const b = brAt(lvlSeason, NM.foc);
    if (b && dy === brPos(b).side){ NM.br = BR.indexOf(b); NM.bi = NM.br; snd("click"); return; }  // dala gir
    step = dy;
  }
  if (!step) return;
  const i = NM.foc+step;
  if (i > 11){ if (lvlSeason >= 11) return snd("alert"); setSeason(lvlSeason+1, 0); snd("click"); return; }
  if (i < 0){  if (lvlSeason <= 0) return snd("alert");  setSeason(lvlSeason-1, 11); snd("click"); return; }
  NM.foc = i; syncSel(); snd("click");
}

/* ------------------------------------------------------------------ KLAVYE (yakalama aşamasında: eski handleMeta'dan önce) */
addEventListener("keydown", e => {
  if (e.code === "F9" && st && st.state === "title" && lvlOpen){ NM.debug = !NM.debug; e.preventDefault(); e.stopImmediatePropagation(); return; }
  if (!isOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  const c = e.code; let h = true;
  if (c === "ArrowRight" || c === "KeyD") nav(1,0);
  else if (c === "ArrowLeft" || c === "KeyA") nav(-1,0);
  else if (c === "ArrowUp" || c === "KeyW") nav(0,-1);
  else if (c === "ArrowDown" || c === "KeyS") nav(0,1);
  else if (c === "KeyQ" || c === "PageUp") seasonStep(-1);
  else if (c === "KeyE" || c === "PageDown") seasonStep(1);
  else if (c === "Home"){ NM.useKb = true; NM.br = -1; NM.foc = 0; syncSel(); snd("click"); }
  else if (c === "End"){ NM.useKb = true; NM.br = -1; NM.foc = clamp(unlocked()-1-lvlSeason*12, 0, 11); syncSel(); snd("click"); }
  else if (c === "Enter" || c === "NumpadEnter" || c === "Space"){ if (!e.repeat){ NM.useKb = true; startFocused(); } }
  else if (c === "Escape" || c === "KeyL"){ if (!e.repeat) closeMap(); }
  else h = false;
  if (h){ e.stopImmediatePropagation(); e.preventDefault(); initAudio(); }
}, true);

/* ------------------------------------------------------------------ FARE / DOKUNMATİK */
addEventListener("pointermove", e => {
  if (e.target !== canvas || e.pointerType === "touch") return;
  NM.mx = e.clientX*devicePixelRatio; NM.my = e.clientY*devicePixelRatio; NM.useKb = false;
}, true);
addEventListener("pointerdown", e => {
  if (e.target !== canvas || !isOpen()) return;
  e.stopImmediatePropagation(); e.preventDefault(); initAudio();
  const x = e.clientX*devicePixelRatio, y = e.clientY*devicePixelRatio, g = NM.geo;
  if (e.pointerType !== "touch"){ NM.mx = x; NM.my = y; NM.useKb = false; } else { NM.mx = -1; NM.useKb = true; }
  const h = hitAt((x-g.X)/g.u, (y-g.Y)/g.u); if (!h) return;
  if (h.t === "close") closeMap();
  else if (h.t === "prev") seasonStep(-1);
  else if (h.t === "next") seasonStep(1);
  else if (h.t === "play") startFocused();
  else if (h.t === "node"){
    const f = nodeInfo(lvlSeason, h.i, unlocked(), meta().done || {});
    if (NM.br < 0 && NM.foc === h.i) startFocused();                 // seçili aktif düğüme tekrar tık = başlat
    else { focusNode(h.i); if (f.lock) deny("🔒 Bu bölüm kilitli", "n"+h.i); }
  }
  else if (h.t === "br"){
    if (NM.br === h.k) startFocused();
    else { NM.br = h.k; NM.bi = h.k; snd("click"); if (!BR[h.k].ok() && !NM.debug) deny("🔒 "+(reqTxt(BR[h.k]) || "Kilitli"), "b"+h.k); }
  }
}, true);
setInterval(() => { if (!lvlOpen && canvas.style.cursor) canvas.style.cursor = ""; }, 300);

/* ------------------------------------------------------------------ AÇILIŞ: seçili bölümün sezonunda, o düğümde */
const _ol = openLevels;
openLevels = function(){
  _ol();
  lvlStage = 1; lvlSeason = clamp(Math.floor(sel/12), 0, 11);
  NM.br = -1; NM.foc = sel % 12; NM.m = NM.foc; NM.bb = 0; NM.hov = null; NM.useKb = true; NM.shk = null; NM.last = performance.now();
};

/* ------------------------------------------------------------------ HATA DÜZELTMESİ
   Özel bölüm (eğitim/bonus/gizli = index 144) bitince winGame() "plat2_unlock" değerini 145'e çekiyor,
   sonraki açılışta unlocked() 144'e kırpıyor ve TÜM bölümler açılıyordu. Burada eski değer korunur. */
const _wg = winGame;
winGame = function(){
  const custom = st && st.lvl >= 144; let keep = null;
  if (custom){ try{ keep = localStorage.getItem("plat2_unlock"); }catch(e){} }
  _wg.apply(this, arguments);
  if (custom){
    if (keep !== null){ try{ localStorage.setItem("plat2_unlock", keep); }catch(e){} }
    if (lb && lb[st.lvl] !== undefined){ delete lb[st.lvl]; sv("plat2_lb", JSON.stringify(lb)); }
  }
};
})();
</script>

<script>
/* UÇAN BOSS ZEMİN DÜZELTMESİ (v24)
   Uçan boss / mini boss (Kızıl Kartal vb.) dalış ve süzülmede kendi "gnd" tahminini kullanıyordu;
   gerçek zemin bu değerden yukarıdaysa boss zeminin içine giriyordu. Artık her karede haritadaki
   gerçek zemine bakılır: boss'un altındaki ilk katı blok bulunur ve boss onun üstünde tutulur. */
(function(){
"use strict";
const _u = updateBoss;
function floorTop(b){
  const c0 = Math.floor(b.x-b.hw*0.85+0.5), c1 = Math.floor(b.x+b.hw*0.85+0.5), r0 = Math.max(0, Math.floor(b.y+0.5));
  let best = Infinity;
  for (let c = c0; c <= c1; c++) for (let r = r0; r < MH; r++) if (solidAt(c, r)){ best = Math.min(best, r-0.5); break; }
  return best;
}
updateBoss = function(b, dt){
  const fly = b && !b.dead && !b.gone && !b.sleep && b.kind !== "golem";
  if (fly){ const t0 = floorTop(b); if (t0 < Infinity) b.gnd = t0; }   // AI'nin zemin hedefi = gerçek zemin (dalış/düşüş bitebilsin)
  _u(b, dt);
  if (!fly || b.dead || b.gone) return;
  const top = floorTop(b);
  if (top < Infinity && b.y > top-b.hh){ b.y = top-b.hh; if (b.vy > 0) b.vy = 0; }
};
})();
</script>
